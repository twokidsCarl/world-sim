# world-sim 的云端部署：一台主机，四个容器。说明见 deploy/README.md。
# The cloud deployment of world-sim: one host, four containers. See deploy/README.md.
#
#   cp deploy/.env.example deploy/.env   # 填好 / fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build

name: world-sim

x-loom: &loom
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &loom-env
    IDEA_LOOM_VAPID_PUBLIC: ${VAPID_PUBLIC:-}
    IDEA_LOOM_SIM_DOMAIN: ${SIM_DOMAIN}
    IDEA_LOOM_PUBLIC_URL: https://${HUB_DOMAIN}
    IDEA_LOOM_PLAY_URL: http://play:8768
    IDEA_LOOM_INTERNAL_TOKEN: ${INTERNAL_TOKEN}

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
      SIM_DOMAIN: ${SIM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [hub, play]

  hub:
    <<: *loom
    build: { context: .., dockerfile: deploy/Dockerfile, target: hub }
    # 登录用的密钥只给 hub。 / The sign-in secrets go to the hub only.
    environment:
      <<: *loom-env
      IDEA_LOOM_OWNER: ${OWNER_GITHUB:?先在 .env 里填 OWNER_GITHUB / set OWNER_GITHUB in .env first}
      IDEA_LOOM_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      IDEA_LOOM_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      IDEA_LOOM_SESSION_SECRET: ${SESSION_SECRET}
      IDEA_LOOM_VAPID_PRIVATE: ${VAPID_PRIVATE:-}   # 访客提愿望时由 hub 推送 / the hub pushes when a visitor sends a wish
      IDEA_LOOM_DB: /srv/state/db/loom.sqlite
    volumes:
      - repo:/srv/repo:ro          # 只读：读名片和版本号 / read-only: card files and versions
      - state:/srv/state           # 数据库和运行数据 / the database and run data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8767/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  play:
    <<: *loom
    build: { context: .., dockerfile: deploy/Dockerfile, target: play }
    # 这个容器运行的是各子项目的代码，访客的请求会打到它上面：
    # 它不带任何密钥，不能提权，资源有上限。
    # This container runs the subprojects' code and takes visitors' requests: it carries no
    # secrets, cannot gain privileges, and has resource limits.
    environment:
      <<: *loom-env
      IDEA_LOOM_REPO_URL: ${REPO_URL}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - repo:/srv/repo             # 它负责定时从远端取新的提交 / it fetches new commits on a timer
      - play-state:/srv/state      # 它自己的卷：快照和构建。数据库所在的卷它碰不到 / its own volume for snapshots and builds; it cannot reach the volume the database is on

  worker:
    <<: *loom
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    # 用 --profile jobs 启动。不启动它，hub 上的作业就一直排着队。
    # Start it with --profile jobs. Without it, jobs queued on the hub simply stay queued.
    profiles: ["jobs"]
    # 只有这个容器拿得到订阅令牌和仓库的推送凭证。它没有对外的端口。
    # Only this container gets the subscription token and the push credential. It exposes no port.
    environment:
      <<: *loom-env
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      GH_TOKEN: ${GH_TOKEN}
      IDEA_LOOM_REPO_URL: ${REPO_URL}
      IDEA_LOOM_WORK: /srv/work
      IDEA_LOOM_DB: /srv/state/db/loom.sqlite
      IDEA_LOOM_VAPID_PRIVATE: ${VAPID_PRIVATE:-}   # 作业的结果由 worker 推送 / job results are pushed by the worker
      IDEA_LOOM_API: http://hub:8767     # 小助手的工具回调打到 hub / the assistant's tool callbacks go to the hub
      IDEA_LOOM_MAINTENANCE: ${MAINTENANCE:-0}
      IDEA_LOOM_MAINTENANCE_BELOW: ${MAINTENANCE_BELOW:-5}
      IDEA_LOOM_JOBS_PER_DAY: ${JOBS_PER_DAY:-6}
      IDEA_LOOM_USAGE_PAUSE: ${USAGE_PAUSE:-0.8}
      GIT_AUTHOR_NAME: ${GIT_NAME}
      GIT_AUTHOR_EMAIL: ${GIT_EMAIL}
      GIT_COMMITTER_NAME: ${GIT_NAME}
      GIT_COMMITTER_EMAIL: ${GIT_EMAIL}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 1024
    mem_limit: 6g
    volumes:
      - state:/srv/state
      - work:/srv/work             # 它自己的一份仓库和每个作业的工作区 / its own clone and per-job workspaces

  backup:
    # 数据库的连续备份。填好 .env 里的 BACKUP_* 之后用 --profile backup 启动。
    # Continuous backup of the database. Fill in BACKUP_* in .env, then start it with --profile backup.
    image: litestream/litestream:0.3
    profiles: ["backup"]
    restart: unless-stopped
    user: "10001"                  # 和 hub 里的用户一样，免得把数据库文件的属主改掉 / the same user as in the hub, so the database files keep their owner
    command: ["replicate"]
    environment:
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT}
      BACKUP_REGION: ${BACKUP_REGION}
      LITESTREAM_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY}
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - state:/srv/state
    depends_on: [hub]

volumes:
  caddy-data:
  repo:
  state:
  play-state:
  work:
