# world-sim 的云端部署：一台主机，四个容器。说明见 deploy/README.md。
# The cloud deployment of world-sim: one host, four containers. See deploy/README.md.
#
#   cp deploy/.env.example deploy/.env   # 填好 / fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build

name: world-sim

x-loom: &loom
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &loom-env
    IDEA_LOOM_SIM_DOMAIN: ${SIM_DOMAIN}
    IDEA_LOOM_PUBLIC_URL: https://${HUB_DOMAIN}
    IDEA_LOOM_PLAY_URL: http://play:8768
    IDEA_LOOM_INTERNAL_TOKEN: ${INTERNAL_TOKEN}

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
      SIM_DOMAIN: ${SIM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [hub, play]

  hub:
    <<: *loom
    build: { context: .., dockerfile: deploy/Dockerfile, target: hub }
    # 登录用的密钥只给 hub。 / The sign-in secrets go to the hub only.
    environment:
      <<: *loom-env
      IDEA_LOOM_OWNER: ${OWNER_GITHUB:?先在 .env 里填 OWNER_GITHUB / set OWNER_GITHUB in .env first}
      IDEA_LOOM_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      IDEA_LOOM_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      IDEA_LOOM_SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - repo:/srv/repo:ro          # 只读：读名片和版本号 / read-only: card files and versions
      - state:/srv/state           # 数据库和运行数据 / the database and run data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8767/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  play:
    <<: *loom
    build: { context: .., dockerfile: deploy/Dockerfile, target: play }
    # 这个容器运行的是各子项目的代码，访客的请求会打到它上面：
    # 它不带任何密钥，不能提权，资源有上限。
    # This container runs the subprojects' code and takes visitors' requests: it carries no
    # secrets, cannot gain privileges, and has resource limits.
    environment:
      <<: *loom-env
      IDEA_LOOM_REPO_URL: ${REPO_URL}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - repo:/srv/repo             # 它负责定时从远端取新的提交 / it fetches new commits on a timer
      - state:/srv/state

  worker:
    <<: *loom
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    # 作业搬到 worker 的那一步做好之前不启动它。到时候用 --profile jobs 启动。
    # Not started until jobs have moved to the worker; then start it with --profile jobs.
    profiles: ["jobs"]
    # 只有这个容器拿得到订阅令牌和仓库的推送凭证。它没有对外的端口。
    # Only this container gets the subscription token and the push credential. It exposes no port.
    environment:
      <<: *loom-env
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      GH_TOKEN: ${GH_TOKEN}
      IDEA_LOOM_REPO_URL: ${REPO_URL}
      IDEA_LOOM_WORK: /srv/work
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 1024
    mem_limit: 6g
    volumes:
      - state:/srv/state
      - work:/srv/work             # 它自己的一份仓库和每个作业的工作区 / its own clone and per-job workspaces

volumes:
  caddy-data:
  repo:
  state:
  work:
