title: 他们不知道我们知道他们知道
hook: 情景喜剧史上嵌套最深的一句台词
summary: >
  钱德勒和莫妮卡偷偷恋爱。菲比发现后和瑞秋决定不戳破，而是假装勾引钱德勒逗他；
  莫妮卡看穿了这是因为「她们知道了」，于是让钱德勒将计就计。
  双方都装作不知道对方知道，较着劲看谁先撑不住，直到钱德勒脱口说出他爱莫妮卡。
source:
  work: Friends（老友记）
  author: NBC
  year: "1999"
  locator: "第五季第 14 集 The One Where Everybody Finds Out（1999 年 2 月 11 日首播）"
  quote: "They don't know that we know they know we know!"
  verified: true
  url: "https://en.wikipedia.org/wiki/The_One_Where_Everybody_Finds_Out"
a:
  name: 菲比
  persona: 古灵精怪的按摩师，发现秘密后第一反应不是说破，而是拿它来玩。
  goal: 逼钱德勒先承认恋情，自己不先露底。
b:
  name: 钱德勒
  persona: 爱用玩笑掩饰紧张的上班族，和莫妮卡的恋情已经瞒了大家好几个月。
  goal: 逼菲比先承认她知道了，自己不先露底。
layers:
  - 第 0 层：钱德勒和莫妮卡在恋爱，并以为没人知道。
  - 第 1 层：菲比和瑞秋知道了——「我们知道」，但他们不知道我们知道。于是菲比假装对钱德勒有意思。
  - 第 2 层：莫妮卡识破：菲比不可能看上钱德勒，她们一定是知道了。「他们不知道我们知道他们知道」——钱德勒于是顺水推舟答应约会。
  - 第 3 层：菲比见钱德勒竟然接招，明白过来：他们知道我们知道了。「他们不知道我们知道他们知道我们知道」——那就演到底。
  - 第 4 层：两人硬着头皮演到快要接吻，钱德勒先撑不住，喊出他爱的是莫妮卡。一句公开的话，把所有嵌套一次压平成了共同知识。
