title: 电子邮件博弈
hook: 确认了一万次，仍然不敢动手
summary: >
  两人想协同行动，但只有在某种状态下才值得，且只有甲知道状态。甲的电脑自动发信告知乙，
  乙的电脑自动回执，甲的再回执……每封信都有极小的概率丢失，直到某一封丢了为止。
  鲁宾斯坦证明：无论来回确认了多少封，只要不是无穷封，两人在均衡中仍像完全没通过信一样，不敢协同。
  「几乎是共同知识」与「共同知识」之间，隔着一道不连续的悬崖。
source:
  work: The Electronic Mail Game：Strategic Behavior Under "Almost Common Knowledge"
  author: Ariel Rubinstein
  year: "1989"
  locator: American Economic Review 79(3), pp. 385–391
  quote: ""
  verified: true
  url: "https://www.jstor.org/stable/1806851"
a:
  name: 甲
  persona: 知道真实状态的一方，看着屏幕上「已收到对方第 N 封确认」的计数，仍在想最后那封到了没有。
  goal: 只在确信对方也会行动时才采取冒险的协同行动。
b:
  name: 乙
  persona: 靠邮件得知状态的一方，自己的回执发出去了，却不知道对方收到没有。
  goal: 只在确信对方也会行动时才采取冒险的协同行动。
layers:
  - 第 0 层：甲知道状态是「值得协同」。乙还不知道。
  - 第 1 层：乙收到第一封信——乙知道了。但甲不知道乙知道（信可能丢了）。
  - 第 2 层：甲收到回执——甲知道乙知道。但乙不知道甲知道乙知道（回执可能丢了）。
  - 第 n 层：每多一封信，「我知道你知道……」就多一层；可是最后发信的那个人，永远不知道最后一封到了没有。
  - 倒推：只收到 0 封信的乙不敢动；于是只确认到 1 层的甲料到这一点也不敢动；于是确认到 2 层的乙也不敢动……像多米诺骨牌一样一直倒到第 n 层。
  - 结论：有限层的「我知道你知道」无论多深都不够；协同行动需要的是无穷层同时成立——共同知识。
