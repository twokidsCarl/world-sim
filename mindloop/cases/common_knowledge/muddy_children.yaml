title: 泥孩子
hook: 一句人人早就知道的话，为什么还能改变一切
summary: >
  几个孩子玩耍回来，其中 k 个额头上沾了泥；每人看得见别人，看不见自己。
  父亲当众说「你们当中至少有一个人额头有泥」，然后一遍遍问「知道自己有泥的站出来」。
  前 k-1 次无人动，第 k 次所有泥孩子同时站出来。当 k≥2 时，父亲那句话人人早已知道，
  但把它当众说出，才使它成为共同知识。「蓝眼睛岛民」是同一道题。
source:
  work: 共同知识经典谜题（泥孩子 / 蓝眼睛岛民）
  author: 早期版本见 J. E. Littlewood, A Mathematician's Miscellany (1953)；形式化见 Fagin, Halpern, Moses & Vardi, Reasoning About Knowledge (1995)；概念源自 D. Lewis, Convention (1969) 与 R. Aumann (1976)
  year: "1953"
  locator: Reasoning About Knowledge 第一章
  quote: ""
  verified: false
  url: "https://en.wikipedia.org/wiki/Common_knowledge_(logic)"
a:
  name: 泥孩子甲
  persona: 额头有泥而不自知的孩子，逻辑极好，看见乙额头有泥，一边看一边想「他怎么还不站出来」。
  goal: 一旦能确定自己额头有泥，就立刻站出来；不确定就绝不动。
b:
  name: 泥孩子乙
  persona: 同样额头有泥、同样聪明的孩子，看着甲，想着一模一样的事。
  goal: 一旦能确定自己额头有泥，就立刻站出来；不确定就绝不动。
layers:
  - 第 0 层（以两个泥孩子为例）：甲看见乙有泥，所以甲早就知道「至少一人有泥」；乙也一样。父亲的话似乎是废话。
  - 第 1 层：但甲不知道乙是否知道「至少一人有泥」——假如甲自己是干净的，乙眼里就一个泥孩子也没有。父亲当众一说，甲才确知乙也知道。
  - 第 2 层：第一问：甲想，如果我是干净的，乙只看到干净的脸，听了父亲的话就会立刻知道泥在自己头上，他会站出来。
  - 第 3 层：乙没有站出来。甲于是知道乙也看见了泥——那只能是我。乙对称地得出同样结论，第二问两人同时站出。
  - 第 k 层：k 个泥孩子时，每个人都在等「如果我干净，其余 k-1 个会在第 k-1 问站出来」；每一轮无人动，都把「大家都知道大家都知道……」加深一层，到第 k 问恰好够用。
  - 关键：父亲的话没有增加任何人的一阶知识，它增加的是高阶知识——把一件「人人知道」的事变成了「人人知道人人知道……」的共同知识。
