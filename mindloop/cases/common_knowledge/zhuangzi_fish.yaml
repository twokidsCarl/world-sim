title: 濠梁之辩
title_en: "The debate on the bridge over the Hao"
hook: 两千三百年前，就有人追问「你怎么知道我不知道」
hook_en: "Reader · 2,300 years ago someone already asked: how do you know that I don't know?"
summary: >
  庄子与惠子在濠水桥上散步。庄子说鱼儿从容出游，是鱼之乐。惠子反问：你不是鱼，怎知鱼乐？
  庄子回敬：你不是我，怎知我不知鱼乐？惠子顺势再推一层，庄子却不再往上叠，
  而是退回原点——你问「你从哪里知道」，就已经承认我知道了；我是在濠水之上知道的。
source:
  work: 《庄子》
  author: 庄周
  year: 战国
  locator: 外篇·秋水
  quote: "惠子曰：「子非鱼，安知鱼之乐？」庄子曰：「子非我，安知我不知鱼之乐？」"
  verified: true
  url: "https://zh.wikisource.org/wiki/莊子/秋水"
a:
  name: 庄子
  persona: 漆园吏，物我两忘，觉得站在桥上看鱼，快乐是不需要证明的。
  goal: 守住「我知道鱼快乐」，不被拖进无穷的追问。
b:
  name: 惠子
  persona: 名家的辩者，庄子最好的朋友和对手，凡事都要问一句「你凭什么知道」。
  goal: 用逻辑证明庄子不可能知道鱼的心思。
layers:
  - 第 0 层：庄子说，鱼很快乐。（一个关于鱼的心思的判断）
  - 第 1 层：惠子说，你不是鱼，怎么知道鱼的快乐？（你无法知道别人的心）
  - 第 2 层：庄子说，你不是我，怎么知道我不知道鱼的快乐？（那你也无法知道我的心）
  - 第 3 层：惠子说，我不是你，固然不知道你；你不是鱼，所以你也不知道鱼——这就全了。（把第 2 层接过来，当作第 1 层的论据）
  - 出口：庄子说，请循其本。你问「汝安知鱼乐」，是已经知道我知道才来问我的；我知之濠上也。（不再加层，而是指出对话本身已经预设了彼此能懂）
