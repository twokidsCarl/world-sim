title: 纽约碰头
title_en: "Meeting in New York"
hook: 没法商量时，两个人会不约而同想到同一个地方
hook_en: "With no way to confer, two people still think of the same place"
summary: >
  谢林问学生：明天要在纽约和一个陌生人见面，没约地点，也无法联系，你去哪儿？
  多数人选了大中央车站的问讯处。没有哪个地点本身更好，
  它只是「我觉得你会觉得我会去」的那个点——后来被称为谢林点（焦点）。
source:
  work: The Strategy of Conflict（冲突的战略）
  author: Thomas C. Schelling
  year: "1960"
  locator: "纽约碰头的默契实验（通常引作第三章，页码未核对）"
  quote: ""
  verified: false
  url: "https://en.wikipedia.org/wiki/Focal_point_(game_theory)"
a:
  name: 你
  persona: 到纽约出差的人，只知道今天要和对方碰面，手机没电，脑子里转的是「他会猜我去哪」。
  goal: 和对方出现在同一个地方。
b:
  name: 陌生人
  persona: 同样没法联系你的另一个人，对纽约的了解和你差不多，也在猜你会去哪。
  goal: 和你出现在同一个地方。
lam: 0.5
game:
  kind: simultaneous
  actions_a: [大中央车站, 帝国大厦, 时代广场, 自由女神像]
  actions_b: [大中央车站, 帝国大厦, 时代广场, 自由女神像]
  salience_a: [0.4, 0.25, 0.2, 0.15]   # 第一个冒出来的念头：车站略占上风
  salience_b: [0.4, 0.25, 0.2, 0.15]
  u_a:               # 碰上了都得 10，碰不上都是 0；地点本身无所谓好坏
    - [10, 0, 0, 0]
    - [0, 10, 0, 0]
    - [0, 0, 10, 0]
    - [0, 0, 0, 10]
  u_b:
    - [10, 0, 0, 0]
    - [0, 10, 0, 0]
    - [0, 0, 10, 0]
    - [0, 0, 0, 10]
canonical:
  depth_a: 1
  depth_b: 1
  choice_a: 大中央车站
  choice_b: 大中央车站
  note: 只凭直觉（第 0 层）碰上的概率不到三成；每多想一层，「显眼」就被放大一次，两人越来越确定地走向同一处。
