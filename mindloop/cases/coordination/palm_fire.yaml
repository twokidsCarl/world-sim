title: 掌中一个「火」字
hook: 两个互相提防的人，各写一字，摊开手一模一样
summary: >
  赤壁战前，周瑜请诸葛亮商议破曹之策。两人都不肯先开口，约定各自在掌心写一个字，
  同时摊开——周瑜掌中是「火」，诸葛亮掌中也是「火」。
  不必商量，因为双方都知道对方看得见同样的局面：北军战船相连，唯火可破。
source:
  work: 《三国演义》
  author: 罗贯中
  year: 明
  locator: "第四十六回 用奇谋孔明借箭 献密计黄盖受刑"
  quote: "原来周瑜掌中字，乃一「火」字；孔明掌中，亦一「火」字。"
  verified: true
  url: "https://zh.wikisource.org/wiki/三國演義/第046回"
a:
  name: 周瑜
  persona: 东吴大都督，心高气傲，既想试探诸葛亮的深浅，又暗暗希望他和自己想的一样。
  goal: 和诸葛亮定下同一条破曹之计。
b:
  name: 诸葛亮
  persona: 刘备的军师，客居东吴，早已看透战局，也看透周瑜想考他。
  goal: 和周瑜定下同一条破曹之计。
lam: 0.5
game:
  kind: simultaneous
  actions_a: [火, 箭, 水]
  actions_b: [火, 箭, 水]
  salience_a: [0.4, 0.35, 0.25]   # 第一念：火攻、箭战、水战各有道理，火略占先
  salience_b: [0.4, 0.35, 0.25]
  u_a:               # 想到一处才有用；同是一计，火攻最能破连环战船
    - [10, 0, 0]
    - [0, 6, 0]
    - [0, 0, 4]
  u_b:
    - [10, 0, 0]
    - [0, 6, 0]
    - [0, 0, 4]
canonical:
  depth_a: 1
  depth_b: 1
  choice_a: 火
  choice_b: 火
  note: 两人各想一层就够了：「他是明白人，必然也看出火攻最好」。再往上每一层都只是更加确信。
