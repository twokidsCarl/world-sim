title: 鸡肋
hook: 猜得太准，是要掉脑袋的
summary: >
  曹操屯兵斜谷，进退两难。夏侯惇来问夜间口令，他正对着碗里的鸡肋出神，随口说「鸡肋」。
  夏侯惇只当是口令传了下去；杨修一听便知魏王想退兵，叫军士收拾行装。
  曹操被说中心事，以「造言乱我军心」把杨修斩了。
source:
  work: 《三国演义》
  author: 罗贯中
  year: 明
  locator: "第七十二回 诸葛亮智取汉中 曹阿瞒兵退斜谷"
  quote: 鸡肋者，食之无肉，弃之有味。
  verified: true
  url: "https://zh.wikisource.org/wiki/三國演義/第072回"
a:
  name: 曹操
  persona: 魏王，心里已想退兵，却不肯先说出口；最恨别人看穿他的心事还到处声张。
  goal: 在自己下令之前，不让军中因他的心思而动。
b:
  name: 杨修
  persona: 行军主簿，才思敏捷，爱显聪明，一向以猜中曹操的心思为乐。
  goal: 抢先一步读出主公的真实意图并照此准备。
lam: 1.0
game:
  kind: signaling
  states: [想退兵, 想再战]
  prior: [0.5, 0.5]
  true_state: 0
  messages:
    - {text: 鸡肋}
    - {text: 寻常口令}
  actions: [收拾行装, 按兵不动]
  literal:           # [话][状态]：心里想什么，嘴上就带出什么
    - [0.8, 0.2]
    - [0.3, 0.8]
  u_a:               # 曹操：无论想不想退，都不许有人擅自收拾行装
    - [-8, 0]
    - [-10, 3]
  u_b:               # 杨修眼里的账：猜对有功，猜错添乱（他没把自己的脑袋算进去）
    - [5, -2]
    - [-8, 2]
canonical:
  depth_a: 0
  depth_b: 1
  choice_a: 鸡肋
  choice_b: 收拾行装
  note: 曹操是随口而出（第 0 层），杨修只需听话听音（第 1 层）就读穿了；曹操若多想一层就该换句寻常口令——他是事后才想到，于是杀人。
