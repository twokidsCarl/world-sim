title: 「能不能通融一下」
hook: 话说得越含糊，越安全
summary: >
  超速被拦下的司机想塞钱了事。直说「给你五十，别开单了」等于把行贿的把柄递给警察；
  说一句「这事能不能就地解决」，想收的警察听得懂，不想收的也没法凭这句话抓人。
  平克等人用博弈论说明：委婉话赢在「可以否认」。原模型里未知的是警察的类型，
  这里改写为警察不确定司机是真想行贿还是只是客气。
source:
  work: The Logic of Indirect Speech
  author: Steven Pinker, Martin A. Nowak & James J. Lee
  year: "2008"
  locator: PNAS 105(3), pp. 833–838（交警与行贿的例子）
  quote: ""
  verified: true
  url: "https://doi.org/10.1073/pnas.0707192105"
a:
  name: 司机
  persona: 超速被拦，想花点钱免掉罚单，又怕碰上个铁面无私的被当场铐走。
  goal: 免掉罚单，绝不能落下行贿的把柄。
b:
  name: 交警
  persona: 拦车的警察，有便宜也肯占，但只抓证据确凿的，最怕抓错人被投诉。
  goal: 证据确凿就抓，拿不准时宁可心照不宣。
lam: 1.0
game:
  kind: signaling
  states: [想行贿, 只是客气]
  prior: [0.5, 0.5]
  true_state: 0
  messages:
    - {text: 给你五十别开单}
    - {text: 能不能通融一下, cost: 1}   # 拐弯抹角有点费劲，也有点丢面子
    - {text: 什么都不提}
  actions: [心照不宣放行, 以行贿逮捕, 照常开罚单]
  literal:           # [话][状态]
    - [1, 0]         # 明说给钱：只可能是行贿
    - [0.9, 0.5]     # 通融一下：行贿的会说，客气的也会说
    - [0.3, 1]
  u_a:
    - [10, -30, -3]  # 想行贿：放行最好，被捕最惨
    - [4, -30, -3]   # 只是客气：能放行当然好
  u_b:
    - [6, 10, 0]     # 真行贿：坐实了抓人是立功，收下也不坏
    - [-1, -20, 0]   # 只是客气：抓错人后果严重
canonical:
  depth_a: 1
  depth_b: 2
  choice_a: 能不能通融一下
  choice_b: 心照不宣放行
  note: 司机只需想 1 层（明说会被抓）；警察想到第 2 层也无法确信——客气的人也说这句话，所以不敢抓，只能放行。
