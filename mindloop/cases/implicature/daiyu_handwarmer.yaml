title: 黛玉借手炉说话
hook: 骂的是丫头，说给宝玉听，宝钗也听得懂
summary: >
  薛姨妈处，宝钗劝宝玉别喝冷酒，宝玉立刻听从。恰好丫鬟雪雁奉紫鹃之命给黛玉送来手炉，
  黛玉笑着数落雪雁：我平日说的你当耳旁风，怎么她说了你就依，比圣旨还快。
  句句说的是雪雁，句句落在宝玉身上；宝玉知道是奚落他，只嘻嘻一笑，宝钗也知道，却不去睬她。
source:
  work: 《红楼梦》
  author: 曹雪芹
  year: 清
  locator: 第八回
  quote: "也亏你倒听他的话。我平日和你说的，全当耳旁风，怎么他说了你就依，比圣旨还快些！"
  verified: true
  url: "https://zh.wikisource.org/wiki/紅樓夢/第008回"
a:
  name: 林黛玉
  persona: 寄居贾府的表小姐，心细如发，在意宝玉却从不肯明说，醋意只肯借别的话头带出来。
  goal: 让宝玉知道她介意，又不落一句可以被指实的话。
b:
  name: 贾宝玉
  persona: 贾府的公子，最懂黛玉的脾气，知道她话里有话时，装傻一笑是最稳妥的回应。
  goal: 听懂她的意思，又不把场面挑破。
layers:
  - 第 0 层（字面）：黛玉在责备丫头雪雁——我的话你不听，紫鹃的话你倒听。
  - 第 1 层：宝玉听出来了，「她说了你就依」说的其实是他刚才对宝钗言听计从。
  - 第 2 层：黛玉知道宝玉听得出来，所以才敢只对着雪雁说；话是说给丫头的，随时可以否认。
  - 第 3 层：宝玉知道黛玉是故意留了这层可否认的余地，所以不辩解、不接话，只是嘻嘻地笑。
  - 第 4 层：宝钗也听懂了，并且知道黛玉知道她听得懂——她选择不理会，于是三个人都明白，谁也没说破。
