title: 鸿门宴
title_en: "The banquet at Hongmen"
hook: 满座都在打暗号，只有该看懂的那个人不接
hook_en: "Reader · The whole table is trading signals; the one man meant to read them will not"
summary: >
  鸿门宴上，范增几次向项羽使眼色，三次举起所佩的玉玦示意他下决心杀刘邦，项羽默然不应。
  范增只得出去叫项庄以舞剑为名行刺；项伯看出来，也拔剑起舞，用身体护住刘邦；
  张良看出来，出去对樊哙说了那句话。一场宴席，没有一句明话。
source:
  work: 《史记》
  author: 司马迁
  year: 西汉
  locator: "项羽本纪（卷七）·鸿门宴"
  quote: 今者项庄拔剑舞，其意常在沛公也。
  verified: true
  url: "https://zh.wikisource.org/wiki/史記/卷007"
a:
  name: 范增
  persona: 项羽的谋士，被尊为亚父，认定刘邦是心腹大患，急得只能在席上打暗号。
  goal: 不动声色地让项羽下令，在席间除掉刘邦。
b:
  name: 项羽
  persona: 四十万大军的统帅，自负而重情面，刚被刘邦一番谢罪说软了心。
  goal: 既不想背上宴席杀人的名声，也不想当众驳亚父的面子。
layers:
  - 第 0 层（字面）：范增举起玉玦——不过是席间把玩佩玉；项庄舞剑——不过是军中无以为乐。
  - 第 1 层：项羽看得懂：「玦」者「决」也，亚父要他下决心动手。
  - 第 2 层：范增知道项羽看懂了，所以项羽的「默然不应」不是没看见，而是不肯——他只好绕开项羽，另派项庄。
  - 第 3 层：项伯、张良知道舞剑是冲着沛公来的，也知道范增不便明说；于是项伯同样用「舞剑」来挡，张良出去找樊哙。
  - 第 4 层：人人都知道人人都看懂了，却都只在「助兴」的名义下行事——因为谁先把话挑明，谁就要担撕破脸的责任。
