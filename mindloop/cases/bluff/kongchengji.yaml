title: 空城计
title_en: "The empty fort"
hook: 诸葛亮赌的是司马懿「多想一层」
hook_en: "Zhuge Liang bets that Sima Yi will think one level too far"
summary: >
  街亭失守，司马懿十五万大军直扑西城。诸葛亮身边只有二千五百老弱，
  他大开四门、登楼抚琴。司马懿见状疑有伏兵，引兵退去。
source:
  work: 《三国演义》
  author: 罗贯中
  year: 明
  locator: "第九十五回 马谡拒谏失街亭 武侯弹琴退仲达"
  quote: 亮平生谨慎，不曾弄险。今大开城门，必有埋伏。
  verified: true
  url: "https://zh.wikisource.org/wiki/三國演義/第095回"
a:
  name: 诸葛亮
  persona: 蜀汉丞相，世人皆知他一生用兵谨慎，从不弄险。
  goal: 让司马懿不要攻城。
b:
  name: 司马懿
  persona: 魏军统帅，老谋深算，生性多疑，深知诸葛亮的为人。
  goal: 有把握就攻城，有埋伏就退兵。
lam: 1.0
game:
  kind: signaling
  states: [城中无兵, 城中有伏兵]
  prior: [0.5, 0.5]
  true_state: 0
  messages:
    - {text: 大开城门抚琴}
    - {text: 紧闭城门死守}
  actions: [进攻, 退兵]
  literal:         # [话][状态]：字面上，敞开的城像是没兵，紧闭的城像是有守军
    - [0.9, 0.1]
    - [0.3, 0.7]
  u_a:             # [状态][司马懿的行动]
    - [-10, 5]     # 无兵：被攻则亡，退则生
    - [8, 0]       # 有伏：巴不得他来攻
  u_b:
    - [10, -3]     # 无兵：攻则大胜，退则错失良机
    - [-8, 0]      # 有伏：攻则中计
canonical:
  depth_a: 3
  depth_b: 2
  choice_a: 大开城门抚琴
  choice_b: 退兵
  note: 司马懿想到第 2 层（他谨慎，敢开门必有伏）；诸葛亮想到第 3 层（我知道他会这么想）。
