title: 华容道
hook: 曹操多想了一层，正好踩进诸葛亮多想两层挖的坑
summary: >
  赤壁兵败，曹操逃到岔路口：大路平坦，华容小路上却有几处烟起。
  曹操笑道，诸葛亮多谋，故意在小路烧烟，叫我不敢走，伏兵必在大路。
  于是偏走小路，正撞上等在那里的关羽。
source:
  work: 《三国演义》
  author: 罗贯中
  year: 明
  locator: "第四十九回（诸葛亮命关羽在小路举烟）、第五十回 诸葛亮智算华容 关云长义释曹操"
  quote: 岂不闻兵书有云：虚则实之，实则虚之。
  verified: true
  url: "https://zh.wikisource.org/wiki/三國演義/第050回"
a:
  name: 诸葛亮
  persona: 刘备的军师，算准了曹操熟读兵书、生性多疑，凡事必多想一层。
  goal: 把曹操引到有伏兵的那条路上。
b:
  name: 曹操
  persona: 败军之主，自负深通兵法，越是狼狈越要显得比对手高明。
  goal: 挑一条没有伏兵的路逃回去。
lam: 1.0
game:
  kind: signaling
  states: [伏兵在华容小路, 伏兵在大路]
  prior: [0.5, 0.5]
  true_state: 0
  messages:
    - {text: 小路举烟}
    - {text: 不举烟}
  actions: [走小路, 走大路]
  literal:           # [话][状态]：字面上，有烟处有兵
    - [0.9, 0.1]
    - [0.3, 0.7]
  u_a:               # [状态][曹操的行动]
    - [10, -5]       # 伏兵在小路：他走小路则中伏
    - [-5, 10]
  u_b:
    - [-10, 5]
    - [5, -10]
canonical:
  depth_a: 3
  depth_b: 2
  choice_a: 小路举烟
  choice_b: 走小路
  note: 曹操想到第 2 层（烟是虚张声势，伏兵必在大路）；诸葛亮想到第 3 层（知道他会「虚则实之」，所以实处偏要举烟）。
