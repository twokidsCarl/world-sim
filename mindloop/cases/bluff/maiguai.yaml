title: 卖拐
title_en: "Selling the crutches"
hook: 先让你相信「我看得出你有病」，再让你自己走瘸
hook_en: "Reader · First you believe he can see you are ill; then you limp on your own"
summary: >
  街头，大忽悠要把一副拐卖给一个好端端的路人。他先「猜」出对方的职业，
  再断言对方腿有毛病，让对方跺脚、走两步，把人一步步带到自己觉得腿真的不对劲，
  最后心甘情愿掏钱买拐，还连声道谢。妻子在旁不断拆台，反倒成了他「老实」的证明。
source:
  work: 小品《卖拐》
  author: 赵本山、范伟、高秀敏 表演
  year: "2001"
  locator: 中央电视台春节联欢晚会
  quote: ""
  verified: true
  url: "https://zh.wikipedia.org/wiki/卖拐三部曲"
a:
  name: 大忽悠
  persona: 走街串巷的骗子，察言观色极快，深知要让人信一句假话，先得让他信你这个人。
  goal: 把一副没用的拐卖给一个腿没毛病的人。
b:
  name: 买拐的厨师
  persona: 骑自行车路过的厨师，憨厚，自认不傻，越怕被骗越想证明自己看得明白。
  goal: 弄清自己的腿到底有没有毛病，别上当。
layers:
  - 第 0 层（字面）：一个陌生人说「你腿有病」——路人第一反应是不信：我好好的，你是骗子吧。
  - 第 1 层：大忽悠知道对方会防备，所以先不卖东西，先「猜」他的职业；猜中了，对方心想：他看得出我是厨师，说不定真看得出我的病。
  - 第 2 层：路人以为自己在检验对方（让我走两步就走两步，看你能说出什么）；大忽悠要的正是这个——让他自己走，自己感觉，结论就成了他自己的。
  - 第 3 层：妻子在旁边拆台说「别信他」。路人想：连他老婆都拦着不让卖，可见不是合伙骗我——拦阻反而成了担保。
  - 第 4 层：最后路人反过来劝大忽悠把拐卖给他，还说谢谢。他以为自己多想了一层、识破了「他老婆想坑我」，其实每一层都是对方替他铺好的。
