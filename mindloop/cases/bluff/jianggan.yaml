title: 蒋干盗书
hook: 让对方以为是他自己偷到的，他才会深信不疑
summary: >
  蒋干自告奋勇过江劝降同窗周瑜。周瑜将计就计，大摆筵席，佯装大醉与他同榻，
  故意让他在案上翻到一封伪造的蔡瑁、张允降书。蒋干连夜盗书回报，
  曹操一怒斩了两位水军都督，人头落地才醒悟中计。
source:
  work: 《三国演义》
  author: 罗贯中
  year: 明
  locator: "第四十五回 三江口曹操折兵 群英会蒋干中计"
  quote: "原来蔡瑁、张允结连东吴！"
  verified: true
  url: "https://zh.wikisource.org/wiki/三國演義/第045回"
a:
  name: 周瑜
  persona: 东吴大都督，一眼看穿老同学是来做说客的，正愁没法除掉曹营里懂水战的蔡瑁、张允。
  goal: 让曹操相信蔡瑁、张允通敌，而且相信这是自己人探出来的。
b:
  name: 蒋干
  persona: 曹操帐下幕宾，自恃与周瑜同窗、口才了得，劝降不成，急于带点功劳回去交差。
  goal: 从周瑜那里弄到点有用的东西。
layers:
  - 第 0 层（字面）：案上有一封蔡瑁、张允写给周瑜的密信——他们要献曹操的人头。
  - 第 1 层：蒋干想：周瑜醉了，没防备我；这信是我偷看到的，不是他给我看的，所以是真的。
  - 第 2 层：周瑜知道蒋干会这么想——别人递过来的情报会被怀疑，自己「偷」到的不会。所以他装醉、说梦话、安排人半夜来报「江北有人到」。
  - 第 3 层：曹操本该想到：周瑜明知蒋干是说客，怎会让机密摊在他手边？他没想到这一层就下令斩人。
  - 第 4 层：人头献上，曹操才省悟「吾中计矣」——但他知道认错等于承认自己被看穿，于是不肯说破。
