title: 邹忌问美
title_en: "Zou Ji asks who is fairer"
hook: 夸你的人各有各的理由，唯独不是因为你美
hook_en: "Everyone who praises you has a reason, and it is never your looks"
summary: >
  邹忌问妻、妾、客：我与城北徐公孰美？三人都说徐公不如您。次日徐公来访，
  邹忌细看，自知远不如。他想通了：妻偏爱我，妾怕我，客有求于我。
  三个说话者三种私心，结论一样。这里只把「客」编码成博弈，妻、妾同理，只是私心的来历不同。
source:
  work: 《战国策》
  author: 刘向 编
  year: 西汉
  locator: 齐策一·邹忌修八尺有余
  quote: 吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。
  verified: true
  url: "https://zh.wikisource.org/wiki/戰國策_(士禮居叢書本)/齊/一"
a:
  name: 来客
  persona: 登门有事相求的客人，嘴甜，只想哄主人高兴，徐公到底多美与他无关。
  goal: 让邹忌听了高兴，好开口求事。
b:
  name: 邹忌
  persona: 齐国的相，身长八尺、形貌昳丽，爱照镜子，却不肯被好话蒙住。
  goal: 弄清自己和徐公到底谁美。
lam: 0.5
game:
  kind: signaling
  states: [徐公更美, 邹忌更美]
  prior: [0.7, 0.3]       # 徐公是齐国出了名的美男子
  true_state: 0
  messages:
    - {text: 徐公何能及君也}
    - {text: 君不如徐公, cost: 2}    # 当面说主人不如人：得罪人
  actions: [自以为美, 自知不如]
  literal:
    - [0.1, 0.9]
    - [0.9, 0.1]
  u_a:               # 客：不管真相如何，主人高兴就好
    - [5, 0]
    - [5, 0]
  u_b:               # 邹忌：只想知道真相
    - [-5, 5]
    - [5, -5]
canonical:
  depth_a: 1
  depth_b: 2
  choice_a: 徐公何能及君也
  choice_b: 自知不如
  note: 客想 1 层（他爱听就说给他听）；邹忌想到第 2 层（他有求于我，无论如何都会这么说），这句话便不再算数。原文中邹忌还亲眼看了徐公。
