[project]
name = "mindloop"
version = "0.1.0"
description = "两人「我猜你猜我」互动模拟器：递归心智模型、博弈与真实案例"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
mindloop = "mindloop.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
