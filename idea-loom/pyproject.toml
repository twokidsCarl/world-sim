[project]
name = "idea-loom"
version = "0.1.0"
description = "world-sim 的想法池：生成、查看、归类、合并 idea，分配开发并跟踪进度"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pywebpush>=2.5.0",
]

[project.scripts]
idea-loom = "idea_loom.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
