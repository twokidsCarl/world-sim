title: 多数派人数的效应在三人处饱和
statement: >-
  只有 1 个人持相反意见时，被试几乎不受影响（出错 3.6%）；2 人时出错升到 13.6%；3 人时跳到 31.8%；
  之后再增加人数（4 到 15 人）出错率一直在 31%–37% 之间，不再明显上升。
  只要有一个同伴给出正确答案，多数派的影响就大幅削弱。
kind: quantitative
value: 0.318
range: [0.036, 0.371]
unit: 比例（关键试次出错率；value 为 3 人多数时，range 为 1 人到 15 人各条件的最小和最大值）
conditions: >-
  阿希线段判断实验的变式（1955 年发表），美国男性大学生；一致答错的同伙人数取 1、2、3、4、6、7、9、15；
  各人数下的出错率依次为 3.6%、13.6%、31.8%、35.1%、35.2%、37.1%、35.1%、31.2%。
caveats: >-
  数字来自 1955 年科普文章的图注和正文，各条件的人数较少，文章没有给出置信区间，4 人以上各条件之间的起伏应视为噪声。
  “三人即饱和”是对面对面、同时在场、意见完全一致的多数而言；小镇里的信息是陆续从不同熟人处听到的，
  “听到几个人说”与“屋里同时坐着几个人”并不等价，把它当作阈值模型的形状参考可以，直接当阈值数值则不妥。
  有同伴支持时错误大幅下降这一点，文章给出的一个具体数字是：同伴选更极端的错误答案时，被试错误降到 9%；
  “同伴答对时错误降到四分之一”这一常见说法本次没有在原文中核对到具体数字，故未写入。
theories: [asch_conformity]
metric: ""
sources:
  - work: Opinions and Social Pressure
    author: Solomon E. Asch
    year: 1955
    locator: "Scientific American 193(5): 31–35"
    url: https://archive.org/details/solomon-asch_confirmaty
    verified: true
    checked: >-
      打开了 Internet Archive 上该文扫描件的 OCR 全文（重印版）：图注逐一列出对手为 1、2、3、4、6、7、9、15 人时的出错率
      （3.6%、13.6%、31.8%、35.1%、35.2%、37.1%、35.1%、31.2%），正文重复了 13.6% 和 31.8% 并说明继续加人没有明显增加压力；
      “极端异议者使错误降到 9%”也在正文。卷期页码由 Crossref 确认。
