    verified: false
    checked: >-
      只确认了书目：牛津学术网站的文章页面给出作者、期刊、10 卷 4 期（1946 年冬季号）、501–517 页、DOI 10.1093/poq/10.4.501。
      页面上的摘要不含任何数字，全文在付费墙后，未能确认 70% 是否出现在这篇论文里。
