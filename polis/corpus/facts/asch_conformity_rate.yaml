title: 阿希从众实验的屈从率
statement: >-
  面对一致给出错误答案的多数派，被试在关键试次中约有 36.8% 的判断跟随了错误答案，而单独判断时出错不到 1%。
  个体差异很大：约四分之一的被试自始至终没有跟随过多数，约 75% 的被试至少跟随过一次。
kind: quantitative
value: 0.368
unit: 比例（关键试次中跟随错误多数的判断占比）
conditions: >-
  美国三所高校的男性大学生共 123 人（1955 年发表）；7–9 人一组，只有一名真被试，其余为事先安排好的同伙；
  任务是当众口头判断线段长短，答案一目了然；每轮 18 次判断，其中 12 次多数派故意答错。
caveats: >-
  36.8% 是“判断次数”的占比，不是“人”的占比，常被误写成“三分之一的人从众”；按人算是约 25% 从不屈从、约 75% 至少屈从一次，
  两种口径不要混用。本条数字全部取自阿希 1955 年《科学美国人》的文章（其中“四分之一”“75%”都是约数）；
  1956 年的专著（Psychological Monographs 70(9): 1–70，书目经 Crossref 确认）给出更细的分布，但本次没有打开原文，
  二手资料里常见的 32%、33%、37%、“24% 或 25% 从不屈从”等说法之间的出入未能逐一核对。
  与小镇情境的差距：实验里是陌生人、无利害的知觉判断、当面公开作答；挤兑中是熟人、涉及存款安全、事实本身不明朗，
  从众的动机既有规范压力也有信息推断，屈从率不能直接搬用。样本只有 1950 年代的美国男大学生，跨文化、跨年代的差异本条未覆盖
  （Bond & Smith 1996 的元分析专门讨论这一点，本次只确认了书目，未读内容）。
theories: [asch_conformity]
metric: ""
en:
  title: Yielding rate in the Asch conformity experiments
  statement: >-
    Faced with a majority unanimously giving the wrong answer, participants followed the wrong answer in about 36.8%
    of their judgements on the critical trials, whereas when judging alone they erred less than 1% of the time.
    Individual differences were large: about a quarter of participants never followed the majority from start to
    finish, and about 75% of participants followed it at least once.
  unit: >-
    proportion (share of judgements on critical trials that followed the erroneous majority)
  conditions: >-
    123 male undergraduates in total from three US colleges (published 1955); groups of 7–9 with only one real
    participant, the rest being confederates arranged in advance; the task was to judge the lengths of lines aloud
    in public, with the answer obvious at a glance; 18 judgements per session, on 12 of which the majority
    deliberately answered wrongly.
  caveats: >-
    36.8% is a share of "judgements", not a share of "people", and is often miswritten as "a third of people
    conformed"; counted by person, about 25% never yielded and about 75% yielded at least once, and the two measures
    should not be mixed. All figures in this entry are taken from Asch's 1955 Scientific American article (in which
    "a quarter" and "75%" are both approximate); the 1956 monograph (Psychological Monographs 70(9): 1–70,
    bibliographic details confirmed via Crossref) gives a finer distribution, but the original was not opened this
    time, and the discrepancies among the figures common in secondary sources (32%, 33%, 37%, "24% or 25% never
    yielded" and so on) could not be checked one by one.
    Gap from the small-town setting: in the experiment the others are strangers, the task is a perceptual judgement
    with nothing at stake, and answers are given publicly face to face; in a bank run they are acquaintances, the
    safety of deposits is involved, and the facts themselves are unclear, so the motive to conform includes both
    normative pressure and informational inference, and the yielding rate cannot be carried over directly. The
    sample consists only of US male undergraduates of the 1950s; cross-cultural and cross-period differences are
    not covered by this entry (the meta-analysis by Bond & Smith 1996 discusses precisely this point; this time
    only the bibliographic details were confirmed and the content was not read).
  checked:
    - >-
      Opened the OCR full text of the scan of this article on the Internet Archive (solomon_original_djvu.txt, a
      reprint included in an anthology): the body text states 123 participants, errors of less than 1% under
      ordinary conditions, 36.8% of choices following the erroneous majority under group pressure, and about a
      quarter of participants completely independent; the figure caption states that 75% of participants went
      along with the majority to varying degrees. Volume, issue and page numbers confirmed via Crossref
      (DOI 10.1038/scientificamerican1155-31).
sources:
  - work: Opinions and Social Pressure
    author: Solomon E. Asch
    year: 1955
    locator: "Scientific American 193(5): 31–35"
    url: https://archive.org/details/solomon-asch_confirmaty
    verified: true
    checked: >-
      打开了 Internet Archive 上该文扫描件的 OCR 全文（solomon_original_djvu.txt，是收入文集的重印版）：正文写明 123 名被试、
      平时出错不到 1%、群体压力下 36.8% 的选择跟随错误多数、约四分之一被试完全独立，图注写明 75% 的被试不同程度地附和过多数。
      卷期页码由 Crossref（DOI 10.1038/scientificamerican1155-31）确认。
