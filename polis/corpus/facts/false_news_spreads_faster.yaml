title: 假消息比真消息传得更远更快
statement: >-
  在推特上，被事实核查机构判定为假的消息比真消息传得更远、更快、更深、更广：
  控制了发帖人特征后，假消息被转发的可能性比真消息高约 70%；真消息扩散到 1500 人所花的时间约是假消息的 6 倍，
  达到 10 层转发深度所花的时间约是 20 倍。真消息很少传到 1000 人以上，而最靠前的 1% 假消息级联常能传到 1000 至 10 万人。
kind: quantitative
value: 1.7
unit: 倍（假消息相对真消息的被转发可能性；“高 70%”）
conditions: >-
  2006–2017 年推特上全部经六家事实核查机构核查过的传言，约 12.6 万个转发级联、约 300 万人、450 多万次转发；
  真假由核查机构判定（机构之间一致率 95%–98%）；“70%”来自以转发为因变量的回归，控制了原发者的账号年龄、活跃度、
  粉丝数、关注数和是否认证。
caveats: >-
  样本只包含被核查机构挑中核查的传言，不是全部消息，存在选择偏差（值得核查的假消息本身往往就是传得开的）。
  论文摘要写“约 126,000 个 stories”，正文写的是“约 126,000 个 rumor cascades”，口径是级联而非独立的故事，引用时要注意。
  “6 倍”“20 倍”是达到特定规模或深度的时间之比，不是传播速率之比。作者把差异归因于假消息更新奇，这是解释而非直接证据。
  与小镇情境的差距：这是一键转发、公开广播、陌生人为主的线上平台，传播成本几乎为零；面对面口头传话有成本、有熟人信誉约束，
  真假消息的传播差距是否同样大，没有这篇研究可以支持。数据是 2006–2017 年推特上由六家英文事实核查网站核查过的传言，不代表其他语言、其他平台。
theories: [allport_postman_rumor_law]
metric: ""
en:
  title: False news spreads farther and faster than true news
  statement: >-
    On Twitter, news judged false by fact-checking organisations spread farther, faster, deeper and more broadly
    than true news: after controlling for characteristics of the poster, false news was about 70% more likely to
    be retweeted than true news; true news took about 6 times as long as false news to reach 1,500 people, and
    about 20 times as long to reach a retweet depth of 10. True news rarely reached more than 1,000 people,
    whereas the top 1% of false-news cascades routinely reached between 1,000 and 100,000 people.
  unit: >-
    multiple (likelihood of false news being retweeted relative to true news; "70% higher")
  conditions: >-
    All rumours on Twitter in 2006–2017 that had been checked by six fact-checking organisations, about 126,000
    retweet cascades, about 3 million people and more than 4.5 million retweets; truth or falsity was determined by
    the fact-checking organisations (agreement between organisations 95%–98%); the "70%" comes from a regression
    with retweeting as the dependent variable, controlling for the original poster's account age, activity level,
    number of followers, number of followees and whether the account was verified.
  caveats: >-
    The sample contains only rumours that fact-checking organisations selected for checking, not all news, so
    there is selection bias (false news worth checking is itself often news that has spread).
    The paper's abstract says "about 126,000 stories" while the body text says "about 126,000 rumor cascades"; the
    unit is cascades, not independent stories, which should be borne in mind when citing.
    "6 times" and "20 times" are ratios of the time taken to reach a particular size or depth, not ratios of
    spreading rates. The authors attribute the difference to false news being more novel, which is an
    interpretation rather than direct evidence.
    Gap from the small-town setting: this is an online platform with one-click retweeting, public broadcasting and
    mainly strangers, where the cost of spreading is almost zero; face-to-face word of mouth has a cost and is
    constrained by reputation among acquaintances, and this study provides no support on whether the gap in spread
    between true and false news would be equally large there. The data are rumours on Twitter in 2006–2017 checked
    by six English-language fact-checking websites, and do not represent other languages or other platforms.
  checked:
    - >-
      Opened the full-text PDF of the paper on the MIT Media Lab website: the body text states about 126,000
      rumour cascades, about 3 million people and more than 4.5 million times; "true news takes about 6 times as
      long to reach 1,500 people", "about 20 times as long to reach depth 10", "the top 1% of false-news cascades
      reach 1,000–100,000 people" and "false news is 70% more likely to be retweeted" are all in the body text
      (corresponding to Figure 2 and Figure 4B). Journal volume, issue and page numbers confirmed via the Europe
      PMC record (PMID 29590045) and the PDF footer; the authors' own MIT IDE research brief repeats the three
      figures 6 times, 20 times and 70%.
sources:
  - work: The spread of true and false news online
    author: Soroush Vosoughi, Deb Roy, Sinan Aral
    year: 2018
    locator: "Science 359(6380): 1146–1151"
    url: https://politics.media.mit.edu/papers/Vosoughi_Science.pdf
    verified: true
    checked: >-
      打开了 MIT 媒体实验室网站上的论文全文 PDF：正文写明约 126,000 个传言级联、约 300 万人、450 多万次；
      “真消息到达 1500 人约需 6 倍时间”“到达深度 10 约需 20 倍时间”“前 1% 假消息级联传到 1000–100,000 人”
      “假消息被转发的可能性高 70%”均在正文（对应图 2、图 4B）。期刊卷期页码由 Europe PMC 条目（PMID 29590045）和 PDF 页脚确认；
      作者自己的 MIT IDE 研究简报重复了 6 倍、20 倍和 70% 三个数字。
