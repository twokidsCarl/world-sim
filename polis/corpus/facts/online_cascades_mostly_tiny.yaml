title: 线上传播级联绝大多数极小
statement: >-
  线上内容的传播级联规模极度偏斜：超过 99% 的级联很小，在第一代就终止；
  在七个不同的线上平台上，73%–96% 的级联根本没有传出去（只有发起者一个人），不到 1% 的级联超过 7 个节点。
  达到 100 人以上的级联大约每四千个才有一个（0.025%），真正的“病毒式”爆发约为百万分之一。
kind: quantitative
value: 0.99
unit: 比例（在一代以内终止的小级联占全部级联的份额，来源写的是“超过 99%”）
conditions: >-
  Goel 等 2016：2011 年 7 月至 2012 年 7 月推特上约 10 亿个传播事件（新闻、视频、图片、请愿），平均级联规模 1.3，
  约 99% 的采纳来自发起者本人或其直接粉丝；深入分析的是其中至少 100 个节点的 219,855 个级联。
  Goel、Watts、Goldstein 2012：七个线上场景（Yahoo! Kindness、Yahoo! Zync、The Secretary Game、Twitter News Stories、Twitter Videos、Friend Sense、Yahoo! Voice），
  各场景单节点级联占比 73%–96%，平均级联规模 1.1–1.4，94%–99% 的采纳发生在距发起者一步之内。
caveats: >-
  2012 年论文正文说“73% 到 95%”的级联完全没有扩散，但同一论文表 I 中推特视频一项是 96%，本条区间按表取 73%–96%。
  “超过 99%”在 2016 年论文中是引述 2012 年论文的概括性说法；“千分之一”“四千分之一”“百万分之一”分别对应
  “中等流行”“至少 100 个节点”“病毒式爆款”三个不同门槛，不要混用。级联规模分布是重尾的，但两篇论文都没有把它当作严格的幂律来检验。
  与小镇情境的差距：线上平台的“发起”门槛极低，绝大多数帖子本来就无人理会，所以小级联占比极高；
  小镇里一条关于银行的传言，听到的人有切身利害，再传一次的概率远高于线上转发率，级联规模分布未必同样偏斜。
  这条事实更适合用来检验“大多数传言起不来、少数才爆发”的定性形状，而不是直接比对 99% 这个数。
theories: [granovetter_threshold, watts_global_cascades]
metric: ""
en:
  title: The vast majority of online diffusion cascades are tiny
  statement: >-
    The sizes of diffusion cascades of online content are extremely skewed: more than 99% of cascades are small and
    terminate within the first generation; across seven different online platforms, 73%–96% of cascades did not
    spread at all (only the initiator alone), and fewer than 1% of cascades exceeded 7 nodes.
    Cascades reaching 100 people or more occur roughly once in every four thousand (0.025%), and truly "viral"
    outbreaks are about one in a million.
  unit: >-
    proportion (share of all cascades that are small cascades terminating within one generation; the source says
    "more than 99%")
  conditions: >-
    Goel et al. 2016: about 1 billion diffusion events on Twitter from July 2011 to July 2012 (news, videos,
    images, petitions), with a mean cascade size of 1.3 and about 99% of adoptions coming from the initiator
    himself or his direct followers; the in-depth analysis is of the 219,855 cascades among them with at least 100
    nodes.
    Goel, Watts and Goldstein 2012: seven online settings (Yahoo! Kindness, Yahoo! Zync, The Secretary Game,
    Twitter News Stories, Twitter Videos, Friend Sense, Yahoo! Voice), with the share of single-node cascades in
    each setting 73%–96%, mean cascade size 1.1–1.4, and 94%–99% of adoptions occurring within one step of the
    initiator.
  caveats: >-
    The body text of the 2012 paper says that "73% to 95%" of cascades did not diffuse at all, but in Table I of
    the same paper the Twitter Videos item is 96%; the interval in this entry follows the table and is taken as
    73%–96%.
    "More than 99%" in the 2016 paper is a summary statement citing the 2012 paper; "one in a thousand", "one in
    four thousand" and "one in a million" correspond respectively to three different thresholds, "moderately
    popular", "at least 100 nodes" and "viral hit", and should not be mixed. The distribution of cascade sizes is
    heavy-tailed, but neither paper tests it as a strict power law.
    Gap from the small-town setting: the threshold for "initiating" on an online platform is extremely low, and
    the vast majority of posts are simply ignored anyway, so the share of small cascades is extremely high; with a
    rumour about a bank in a small town, those who hear it have a personal stake, the probability of passing it on
    once more is far higher than the online retweet rate, and the cascade-size distribution is not necessarily
    equally skewed.
    This fact is better suited to testing the qualitative shape that "most rumours never take off and only a few
    break out" than to comparing directly against the figure of 99%.
  checked:
    - >-
      Opened the full-text PDF of the journal version on the first author's personal website (the first page
      prints Management Science 62(1), 2016, pp. 180–196): the introduction states that more than 99% of cascades
      are small and terminate within one generation, that moderately popular events are about one in a thousand
      and that viral hits are about one in a million; the data section states a mean cascade size of 1.3, that
      about 99% of adoptions come from the root node or its direct followers, and that those with at least 100
      nodes make up 0.025% (about one in four thousand, 219,855 in total).
    - >-
      Opened the full-text PDF of the paper on the first author's personal website: the body text states that
      73%–95% of cascades in each setting had no diffusion whatsoever, that fewer than 1% of cascades exceeded 7
      nodes and that fewer than 4% extended beyond one step; Table I lists for the seven settings the share of
      single-node cascades (73%–96%), the mean size (1.1–1.4) and the share of adoptions within one step
      (94%–99%). Conference name and page numbers confirmed via Crossref (DOI 10.1145/2229012.2229058).
