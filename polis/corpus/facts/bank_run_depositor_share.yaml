title: 挤兑中真正跑去取款的储户只占少数
statement: >-
  有储户级数据的两场挤兑里，在恐慌的几天内真正“跑”的储户都只是少数：
  2001 年印度一家合作银行约为 3%（活期类账户）到 5%（定期存款账户），
  1850 年代纽约一家移民储蓄银行在 1854 年和 1857 年两次恐慌中分别为 6% 和 8.7%。
  跑掉的人几乎不回来：印度那家银行取款储户中只有约一成在半年后余额恢复到危机前水平。
kind: quantitative
range: [0.029, 0.087]
unit: 比例（恐慌期间挤兑的储户占全部储户的份额；不同研究、不同口径的范围，未给单一点估计）
conditions: >-
  Iyer 与 Puri：印度古吉拉特邦一家基本面健康的合作银行，因当地最大合作银行 2001 年 3 月 13 日倒闭而被波及，
  挤兑窗口为 3 月 13–15 日；总部 4,574 名定期存款储户中 249 人提前支取（约 5.4%），10,691 名活期类储户中 307 人取走余额的
  75% 以上（约 2.9%）；有存款保险，仅 6.6%（定期）和 1%（活期）的储户余额超过保险上限。
  Kelly 与 Ó Gráda：纽约 Emigrant Industrial Savings Bank 的爱尔兰移民储户，
  1854 年 12 月 11–30 日与 1857 年 9 月 28 日–10 月 13 日两次恐慌，“跑”定义为在此期间销户。
caveats: >-
  5.4% 和 2.9% 是我用工作论文表 1B 的人数（249/4574、307/10691）算出来的，论文正文没有直接印这两个百分比；
  6% 和 8.7% 则是 Kelly 与 Ó Gráda 正文直接给出的。各研究对“跑”的定义不同（提前支取任何定期存款 / 取走 75% 以上活期余额 / 销户），
  比例不可直接相加或比较，所以本条只给范围不给点估计。Iyer 与 Puri 的数字取自 2008 年 FDIC 工作论文版；
  2012 年《美国经济评论》正式发表版的正文本次没能打开，表中人数是否有改动未核对。
  印度那家银行基本面健康且挺过了挤兑，纽约 1857 年的恐慌以各储蓄银行限制取款（每次最多取余额的 10%）收场，
  因此这些比例是“被止住的挤兑”的规模，不是失控挤兑的上限；按人数算比例小，但印度案例中跑的人余额明显更大
  （表 1B），按金额算的流失会更高（本条未收录金额口径）。
  与小镇情境的差距相对较小：两项研究都是一座城市里的一家银行、储户之间靠邻里和熟人传话；
  但一个是有存款保险的 2001 年印度城市，一个是 1850 年代纽约的移民社区（当时没有存款保险，这一点是常识性背景，未在论文中核对）。
theories: [diamond_dybvig_bank_run, global_games_runs]
metric: runner_share
en:
  title: Only a minority of depositors actually go and withdraw in a bank run
  statement: >-
    In the two runs for which depositor-level data exist, the depositors who actually "ran" during the few days of
    panic were only a minority in both cases: at a cooperative bank in India in 2001, about 3% (transaction-type
    accounts) to 5% (term deposit accounts); at an immigrant savings bank in New York in the 1850s, 6% and 8.7%
    respectively in the two panics of 1854 and 1857.
    Those who ran hardly ever came back: at the Indian bank only about one in ten of the withdrawing depositors
    had balances restored to the pre-crisis level half a year later.
  unit: >-
    proportion (share of all depositors who ran during the panic; a range across different studies and different
    definitions, with no single point estimate given)
  conditions: >-
    Iyer and Puri: a fundamentally sound cooperative bank in the Indian state of Gujarat, affected by the failure
    of the largest local cooperative bank on 13 March 2001, with the run window being 13–15 March; at the head
    office, 249 of 4,574 term deposit holders withdrew early (about 5.4%) and 307 of 10,691 transaction-type
    depositors withdrew more than 75% of their balance (about 2.9%); there was deposit insurance, and only 6.6%
    (term) and 1% (transaction) of depositors had balances above the insurance limit.
    Kelly and Ó Gráda: Irish immigrant depositors of the Emigrant Industrial Savings Bank in New York, in the two
    panics of 11–30 December 1854 and 28 September–13 October 1857, with "running" defined as closing the account
    during this period.
  caveats: >-
    5.4% and 2.9% were calculated by me from the head counts in Table 1B of the working paper (249/4574,
    307/10691); the body of the paper does not print these two percentages directly; 6% and 8.7%, by contrast, are
    given directly in the body text of Kelly and Ó Gráda. The studies define "running" differently (early
    withdrawal of any term deposit / withdrawing more than 75% of the transaction balance / closing the account),
    so the proportions cannot be directly added or compared, which is why this entry gives only a range and no
    point estimate. The Iyer and Puri figures are taken from the 2008 FDIC working paper version; the body text of
    the version formally published in the American Economic Review in 2012 could not be opened this time, and
    whether the head counts in the tables were changed has not been checked.
    The Indian bank was fundamentally sound and survived the run, and the New York panic of 1857 ended with the
    savings banks restricting withdrawals (at most 10% of the balance per withdrawal), so these proportions are the
    size of "runs that were stopped", not an upper bound for a run out of control; the proportion is small when
    counted by head, but in the Indian case those who ran had markedly larger balances (Table 1B), so the outflow
    measured by amount would be higher (this entry does not include a measure by amount).
    The gap from the small-town setting is relatively small: both studies concern one bank in one city, with word
    passing among depositors through neighbours and acquaintances; but one is an Indian city in 2001 with deposit
    insurance and the other an immigrant community in 1850s New York (there was no deposit insurance at the time;
    this is common background knowledge and was not checked in the papers).
  checked:
    - >-
      Opened the full-text PDF of the working paper on the FDIC website: Section 5 of the body text and Table 1A
      give 4,574 term depositors, 10,691 transaction-type depositors and the proportions above the insurance
      limit; Table 1B gives the numbers of runners and stayers (term 249 versus 4,325, transaction 307 versus
      10,384) and the definition of "running" (13–15 March; for transaction accounts, withdrawing more than 75%);
      the introduction states that only 10% of the withdrawing depositors had balances restored to the pre-crisis
      level 6 months later. The percentages 5.4% and 2.9% were obtained by dividing these head counts.
    - >-
      Opened the JSTOR scan PDF of the full paper (hosted at beyondragstoriches.omeka.net, with the journal volume,
      issue and page numbers printed on the first page): the body text of Section II states the start and end
      dates of the two panics, the definition of "running" as closing the account during the period, and the
      samples of 598 accounts in 1854 (235 closed) and 1,035 accounts in 1857 (505 closed), and states directly
      that only 6% (1854) and 8.7% (1857) of depositors closed their accounts. Bibliographic details separately
      confirmed via Crossref (DOI 10.1257/aer.90.5.1110).
sources:
  - work: "Understanding Bank Runs: The Importance of Depositor-Bank Relationships and Networks"
    author: Rajkamal Iyer, Manju Puri
    year: 2008
    locator: FDIC Center for Financial Research Working Paper No. 2008-11（2008 年 8 月）
    url: https://www.fdic.gov/analysis/cfr/working-papers/2008/2008-11.pdf
    verified: true
    checked: >-
      打开了 FDIC 网站上的工作论文全文 PDF：正文第 5 节和表 1A 给出 4,574 名定期储户、10,691 名活期类储户、超保险上限的比例；
      表 1B 给出 runners 与 stayers 的人数（定期 249 对 4,325，活期 307 对 10,384）和“跑”的定义（3 月 13–15 日，活期为取走 75% 以上）；
      引言写明取款储户中只有 10% 在 6 个月后余额恢复到危机前水平。百分比 5.4% 和 2.9% 由这些人数相除得到。
  - work: "Market Contagion: Evidence from the Panics of 1854 and 1857"
    author: Morgan Kelly, Cormac Ó Gráda
    year: 2000
    locator: "American Economic Review 90(5): 1110–1124"
    url: https://beyondragstoriches.omeka.net/files/original/1e6669daa285d46185dcea862a4cba51.pdf
    verified: true
    checked: >-
      打开了论文全文的 JSTOR 扫描件 PDF（托管在 beyondragstoriches.omeka.net，首页印有期刊卷期页码）：第 II 节正文写明两次恐慌的起止日期、
      “跑”的定义为期间销户、样本为 1854 年 598 个账户（235 个销户）和 1857 年 1,035 个账户（505 个销户），
      并直接写明只有 6%（1854）和 8.7%（1857）的储户销户。书目另由 Crossref（DOI 10.1257/aer.90.5.1110）确认。
