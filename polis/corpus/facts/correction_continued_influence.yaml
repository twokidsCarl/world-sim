title: 辟谣有效但消不干净
statement: >-
  对错误信息的更正能显著降低人们对它的相信程度，但不能把影响完全消除：一项汇总 32 项研究（N=6,527）的元分析发现，
  更正之后错误信息仍留有虽小但显著的残余影响（r=−0.05，p=0.045）。更正来自原始信源、内容连贯、与受众世界观相容时效果较好；
  错误信息来自可信信源、在更正前被重复多次、或更正来得较晚时，效果较差。
kind: quantitative
value: -0.05
unit: 相关系数 r（更正后错误信息的残余影响；摘要只给出 r=−.05，负号的编码方向需读正文确认）
conditions: >-
  Walter 与 Tukachinsky 的元分析：32 项关于“错误信息被更正后是否仍有影响”的研究，共 6,527 名被试
  （摘要没有说明各研究的具体实验范式和国别）。
  另一项元分析（Chan 等 2017，k=52，N=6,878）用不同口径报告：错误信息本身的效应 d=2.41–3.08，
  辟谣效应 d=1.14–1.33，辟谣后错误信息的残留 d=0.75–1.06。
caveats: >-
  两项元分析的数字看上去差别很大（r=−0.05 对 d=0.75–1.06），原因是比较基准不同，不能互相换算后当作同一个量：
  本次只读了两篇的摘要，没有读正文中各效应量的具体定义，使用前应回到原文确认比较的是哪两组。
  r=−0.05 的 p 值为 0.045，刚过显著性门槛，残余影响“存在但很小”这一结论并不稳固。
  “辟谣适得其反（逆火效应）”不在这两篇摘要的结论之内，本条不支持该说法。
  与小镇情境的差距：这些是受控实验里的信念测量，不是真实行为；挤兑传言事关自己的存款，
  “宁可信其有”的代价不对称，而且辟谣者（银行、官方）正是利益相关方，实际残留有可能大于实验值（这是推断，不是来源的结论）。
  Chan 等的摘要还指出，受众自己为错误信息想过理由时，残留更强、辟谣更弱——这与熟人之间反复议论传言的情形相近。
theories: []
metric: correction_residual
en:
  title: Debunking works but does not wipe the slate clean
  statement: >-
    Correcting misinformation significantly reduces how much people believe it, but cannot eliminate its influence
    completely: a meta-analysis pooling 32 studies (N=6,527) found that after correction the misinformation still
    left a small but significant residual influence (r=−0.05, p=0.045). Corrections work better when they come
    from the original source, are coherent in content and are compatible with the audience's worldview; they work
    worse when the misinformation comes from a credible source, has been repeated many times before the
    correction, or when the correction comes late.
  unit: >-
    correlation coefficient r (residual influence of the misinformation after correction; the abstract gives only
    r=−.05, and the coding direction of the minus sign needs to be confirmed by reading the body text)
  conditions: >-
    The meta-analysis of Walter and Tukachinsky: 32 studies on "whether misinformation still has an influence
    after being corrected", with 6,527 participants in total (the abstract does not state the specific
    experimental paradigms or countries of the individual studies).
    Another meta-analysis (Chan et al. 2017, k=52, N=6,878) reports on a different basis: the effect of the
    misinformation itself d=2.41–3.08, the debunking effect d=1.14–1.33, and the persistence of the misinformation
    after debunking d=0.75–1.06.
  caveats: >-
    The figures of the two meta-analyses look very different (r=−0.05 versus d=0.75–1.06) because the baselines of
    comparison differ, and they cannot be converted into one another and treated as the same quantity: only the
    abstracts of the two papers were read this time, not the specific definitions of each effect size in the body
    text, so before use one should go back to the originals to confirm which two groups are being compared.
    The p-value of r=−0.05 is 0.045, only just past the significance threshold, so the conclusion that the residual
    influence "exists but is very small" is not robust.
    "Debunking backfires (the backfire effect)" is not among the conclusions of these two abstracts, and this entry
    does not support that claim.
    Gap from the small-town setting: these are measurements of belief in controlled experiments, not real
    behaviour; a rumour of a bank run concerns one's own deposits, the costs of "better to believe it just in
    case" are asymmetric, and the debunkers (the bank, the authorities) are precisely the interested parties, so
    the actual residue may be larger than the experimental values (this is an inference, not a conclusion of the
    sources).
    The abstract of Chan et al. also points out that when the audience have themselves thought of reasons for the
    misinformation, the persistence is stronger and the debunking weaker, which is close to the situation of
    acquaintances repeatedly discussing a rumour among themselves.
  checked:
    - >-
      Opened the record page for this article in the Chapman University institutional repository; the paper's
      abstract on that page states k=32, N=6,527, that correction cannot completely eliminate the influence of
      misinformation (r=−.05, p=.045), and the direction of each moderator. Volume, issue and page numbers
      confirmed via Crossref (DOI 10.1177/0093650219854600); the publisher's page returned 403 and the body text
      was not read.
    - >-
      Read the record and abstract of this article through the Europe PMC API (PMCID PMC5673564): the abstract
      states k=52, N=6,878, misinformation effect d=2.41–3.08, debunking effect d=1.14–1.33, persistence after
      debunking d=0.75–1.06, and that "the persistence is stronger when the audience themselves generate
      supporting reasons". Volume, issue and page numbers confirmed via Crossref (DOI 10.1177/0956797617714579).
