      以及各调节因素的方向。卷期页码由 Crossref（DOI 10.1177/0093650219854600）确认；出版社页面返回 403，正文未读。
  - work: "Debunking: A Meta-Analysis of the Psychological Efficacy of Messages Countering Misinformation"
    author: M. S. Chan, C. R. Jones, K. Hall Jamieson, D. Albarracín
    year: 2017
    locator: "Psychological Science 28(11): 1531–1546"
    url: https://europepmc.org/article/MED/28895452
    verified: true
    checked: >-
      通过 Europe PMC 的接口读到该文条目和摘要（PMCID PMC5673564）：摘要写明 k=52、N=6,878，错误信息效应 d=2.41–3.08、
      辟谣效应 d=1.14–1.33、辟谣后残留 d=0.75–1.06，以及“受众自己生成支持理由时残留更强”。卷期页码由 Crossref（DOI 10.1177/0956797617714579）确认。
