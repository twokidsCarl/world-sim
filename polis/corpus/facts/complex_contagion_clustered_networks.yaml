title: 需要多人印证的行为在聚类网络中传得更远更快
statement: >-
  当一种行为需要来自多个熟人的重复信号才会被采纳时，高聚类的网络比随机连边的网络传得更远更快：
  实验中行为平均扩散到聚类网络 53.77% 的成员，而随机网络只有 38.26%，聚类网络中的扩散速度是随机网络的四倍多。
  收到两个邻居的信号比只收到一个时，采纳的可能性明显更高。
kind: quantitative
value: 0.5377
unit: 比例（聚类网络中的平均最终采纳率；对照的随机网络为 0.3826）
conditions: >-
  Centola 2010 的线上实验：1,528 名参与者被匿名分配到人为构造的健康社区网络里，每人有固定数量的“健康伙伴”；
  同样规模和度数的聚类格子网络与随机网络成对比较，共 6 次独立试验（N=98/128/144，每人 6 或 8 个邻居）；
  被传播的行为是注册一个健康论坛，每当一个邻居注册，系统就给你发一封通知；每次试验持续 3 周。
caveats: >-
  只有 6 对网络，差异用秩和检验显著（P<0.01），但效应大小的不确定性很大；邻居是系统分配的匿名陌生人，
  信号是系统邮件而不是人说的话，被试不能直接联系邻居，也不知道对方是谁。论文摘要自己点明了前提：
  只有当行为需要社会强化时聚类才占优，对一次接触就能传开的东西，通行的假说是长程捷径传得更快。
  本次只读了 2010 年原文，没有核对后续的复现和反例。
  与小镇情境的差距：小镇的熟人网络本来就是高聚类的，这条事实支持“同一件事从几个熟人处反复听到才去取款”的阈值式设定，
  但 53.77% 和 38.26% 是这个特定线上实验的数，不是可迁移的参数；模拟宜复现的是方向（聚类网络高于随机网络）和
  “第二个信号的边际作用大”这一形状。
theories: [complex_contagion]
metric: ""
sources:
  - work: The Spread of Behavior in an Online Social Network Experiment
    author: Damon Centola
    year: 2010
    locator: "Science 329(5996): 1194–1197"
    url: https://faculty.cs.byu.edu/~mike/mikeg/papers/SpreadofBehaviorinSocialNetworkExperimentScience.pdf
    verified: true
    checked: >-
      打开了杨百翰大学一位教师网页上保存的 Science 网站全文页面打印件 PDF（页眉印有 Science 329 (5996): 1194、DOI 10.1126/science.1185231）：
      正文写明 1,528 名参与者、三种网络规模、6 次独立试验、每次 3 周，行为平均到达聚类网络的 53.77% 而随机网络为 38.26%，
      聚类网络扩散速率是随机网络的四倍多（P<0.01）。卷期页码另由 Europe PMC 条目（PMID 20813952）确认；
      MIT 新闻办公室 2010 年 9 月 3 日的报道给出四舍五入后的 54% 和 38%。
