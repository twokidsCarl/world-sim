    author: 刘向（编订）
    year:
    locator: 卷二十三 魏二，「龐蔥與太子質於邯鄲」章（维基文库所录为士礼居丛书本，带姚、鲍注）
    url: https://zh.wikisource.org/wiki/戰國策_(士禮居叢書本)/魏/二
    verified: true
    checked: >-
      取回该页原始文本（页眉标 title=戰國策卷二十三、section=魏二、author=劉向），找到「龐蔥與太子質於邯鄲」一章，
      逐句核对了一人/二人/三人三问三答、“三人言而成虎”、“寡人自為知”、“讒言先至”、“後太子罷質，果不得見”。
      注文提到另本“龐蔥”作“龐恭”。成书年代为西汉，无确切年份，故 year 留空。
