title: 三人成虎
kind: idiom
setting: 战国时期，魏国都城大梁与赵国邯郸之间；庞葱将陪魏太子赴邯郸为人质，行前与魏王对话。
summary: >-
  庞葱用一个假设向魏王说明：同一句不实的话，一个人说没人信，两个人说就起疑，三个人说就被当真——信与不信取决于说的人数，而不是事实本身。
  他接着指出自己离开后，非议他的人会远多于三个，而魏王又无法就近核实。
  魏王口头上说自己会判断，结果谗言在庞葱离开后先到，魏王照样信了。
  这个故事给出的是一条很干净的规则：重复来源的数量可以替代证据，并且事先被提醒也不足以免疫。
people:
  - {name: 庞葱, role: 魏臣，将陪太子去邯郸做人质, traits: 清楚知道流言如何起作用，试图在离开前给君主“打预防针”}
  - {name: 魏王, role: 魏国君主，听取并裁断关于臣下的议论, traits: 自认为能独立判断，实际上随说的人数增加而逐步改变信念}
  - {name: 魏太子, role: 赴邯郸的人质, traits: 只是事件背景，不参与传播}
  - {name: 议臣者, role: 朝中在庞葱离开后非议他的人（原文未具名）, traits: 人数“过于三人”，各自重复同一种说法}
events:
  - {what: 庞葱将与太子赴邯郸为质，行前问魏王：若有一人说集市上有虎，信不信？魏王答不信。, who: [庞葱, 魏王]}
  - {what: 庞葱再问：两人都这么说呢？魏王答自己会起疑。, who: [庞葱, 魏王]}
  - {what: 庞葱三问：三人都这么说呢？魏王答自己就信了。, who: [庞葱, 魏王]}
  - {what: 庞葱点明集市上明明没有虎，只因三人都说才“成虎”；邯郸比集市远得多，议论他的人又不止三个，请魏王明察。, who: [庞葱, 魏王]}
  - {what: 魏王表示自己心里有数。庞葱辞行。, who: [魏王, 庞葱]}
  - {what: 庞葱走后，谗言先一步传到魏王那里。, who: [议臣者, 魏王]}
  - {what: 后来太子结束人质身份回国，庞葱果然再也没能见到魏王。, who: [魏太子, 庞葱, 魏王]}
outcome: 尽管事先被明确警告过，魏王仍在多人重复的谗言下改变了对庞葱的看法，庞葱归国后不得再见。
theories: [complex_contagion]
sources:
