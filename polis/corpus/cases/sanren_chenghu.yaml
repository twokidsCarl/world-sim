title: 三人成虎
kind: idiom
setting: 战国时期，魏国都城大梁与赵国邯郸之间；庞葱将陪魏太子赴邯郸为人质，行前与魏王对话。
summary: >-
  庞葱用一个假设向魏王说明：同一句不实的话，一个人说没人信，两个人说就起疑，三个人说就被当真——信与不信取决于说的人数，而不是事实本身。
  他接着指出自己离开后，非议他的人会远多于三个，而魏王又无法就近核实。
  魏王口头上说自己会判断，结果谗言在庞葱离开后先到，魏王照样信了。
  这个故事给出的是一条很干净的规则：重复来源的数量可以替代证据，并且事先被提醒也不足以免疫。
people:
  - {name: 庞葱, role: 魏臣，将陪太子去邯郸做人质, traits: 清楚知道流言如何起作用，试图在离开前给君主“打预防针”}
  - {name: 魏王, role: 魏国君主，听取并裁断关于臣下的议论, traits: 自认为能独立判断，实际上随说的人数增加而逐步改变信念}
  - {name: 魏太子, role: 赴邯郸的人质, traits: 只是事件背景，不参与传播}
  - {name: 议臣者, role: 朝中在庞葱离开后非议他的人（原文未具名）, traits: 人数“过于三人”，各自重复同一种说法}
events:
  - {what: 庞葱将与太子赴邯郸为质，行前问魏王：若有一人说集市上有虎，信不信？魏王答不信。, who: [庞葱, 魏王]}
  - {what: 庞葱再问：两人都这么说呢？魏王答自己会起疑。, who: [庞葱, 魏王]}
  - {what: 庞葱三问：三人都这么说呢？魏王答自己就信了。, who: [庞葱, 魏王]}
  - {what: 庞葱点明集市上明明没有虎，只因三人都说才“成虎”；邯郸比集市远得多，议论他的人又不止三个，请魏王明察。, who: [庞葱, 魏王]}
  - {what: 魏王表示自己心里有数。庞葱辞行。, who: [魏王, 庞葱]}
  - {what: 庞葱走后，谗言先一步传到魏王那里。, who: [议臣者, 魏王]}
  - {what: 后来太子结束人质身份回国，庞葱果然再也没能见到魏王。, who: [魏太子, 庞葱, 魏王]}
outcome: 尽管事先被明确警告过，魏王仍在多人重复的谗言下改变了对庞葱的看法，庞葱归国后不得再见。
theories: [complex_contagion]
en:
  title: "Three men make a tiger"
  setting: >-
    The Warring States period, between Daliang, the capital of the state of Wei, and Handan in the state of Zhao; Pang Cong is about to accompany the
    crown prince of Wei to Handan as a hostage, and speaks with the King of Wei before setting out.
  summary: >-
    Pang Cong uses a hypothetical to show the King of Wei that the same untrue statement is believed by no one when one man says it, raises doubt when two
    men say it, and is taken for true when three men say it: whether it is believed depends on the number of people saying it, not on the fact itself. He
    goes on to point out that after he leaves, those who speak against him will be far more than three, and that the king will have no means of checking
    close at hand. The king says in words that he will judge for himself; in the event the slander arrives first after Pang Cong has left, and the king
    believes it all the same. What the story gives is a very clean rule: the number of sources repeating a thing can stand in for evidence, and being
    warned beforehand is not enough to make one immune.
  people:
    - name: "Pang Cong"
      role: "Minister of Wei, about to accompany the crown prince to Handan as a hostage"
      traits: >-
        Knows clearly how rumour does its work, and tries to "inoculate" his ruler before leaving.
    - name: "The King of Wei"
      role: "Ruler of the state of Wei, who hears and decides on talk about his ministers"
      traits: >-
        Considers himself able to judge independently; in fact his belief changes step by step as the number of speakers increases.
    - name: "The Crown Prince of Wei"
      role: "The hostage sent to Handan"
      traits: >-
        Only the background to the events; takes no part in the spreading.
    - name: "Those who talk about the minister"
      role: "People at court who speak against Pang Cong after he leaves (unnamed in the original text)"
      traits: >-
        Number "more than three", each repeating the same story.
  events:
    - >-
      Pang Cong, about to go with the crown prince to Handan as a hostage, asks the King of Wei before setting out: if one man said there was a tiger in the
      marketplace, would you believe it? The king answers that he would not.
    - >-
      Pang Cong asks again: and if two men both said so? The king answers that he would begin to doubt.
    - >-
      Pang Cong asks a third time: and if three men all said so? The king answers that he would then believe it.
    - >-
      Pang Cong points out that there is plainly no tiger in the marketplace, and that it "becomes a tiger" only because three men all say so; Handan is
      much farther away than the marketplace, and those who talk about him are more than three; he asks the king to look into it clearly.
    - >-
      The king indicates that he knows his own mind. Pang Cong takes his leave.
    - >-
      After Pang Cong has gone, the slander reaches the king a step ahead.
    - >-
      Later the crown prince's time as a hostage ends and he returns home, and Pang Cong, just as foreseen, is never again able to see the king.
  outcome: >-
    Although explicitly warned beforehand, the King of Wei still changed his view of Pang Cong under slander repeated by many people, and after returning
    home Pang Cong was not received again.
  checked:
    - >-
      Fetched the raw text of the page (the header gives title=戰國策卷二十三, section=魏二, author=劉向), found the chapter 「龐蔥與太子質於邯鄲」, and checked sentence by
      sentence the three questions and three answers for one man / two men / three men, “三人言而成虎”, “寡人自為知”, “讒言先至”, and “後太子罷質，果不得見”. The annotation mentions
      that another edition has “龐恭” for “龐蔥”. The work was compiled in the Western Han and has no exact year, so year is left empty.
    - >-
      The article states “三人成虎典出《戰國策·魏策二》” (that "three men make a tiger" comes from the Zhanguo ce, Strategies of Wei II) and quotes the same passage,
      which agrees with what was seen on Wikisource; used only as corroboration of the attribution.
