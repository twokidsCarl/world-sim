title: 人民公敌（En folkefiende）
kind: drama
setting: 19世纪80年代挪威南部一座靠温泉浴场吃饭的海滨小城，前后几天。
summary: >-
  浴场医官斯多克芒查出浴场水源被污染，起初报纸编辑和小业主代表都表示支持，他以为全城会感谢他。
  市长（他的哥哥）把同一件事换了一个说法讲给这些人听：整改要花大钱、浴场要关两年、费用要落到纳税人头上；
  支持者于是逐个倒戈，报纸改登市长的安抚声明，医生的报告没有地方发表。
  到市民大会上，主持人和发言者已经把议题从“水有没有毒”换成了“这个人是不是在害本城”，
  医生被激怒后转而攻击“多数派”，会场当场通过决议宣布他是人民公敌，随后是砸窗、解约、退租、女儿被辞退。
  这是一个真实信息输给利益框架的案例：改变众人态度的不是新证据，而是谁先向谁说明了“这件事对你意味着什么”。
people:
  - {name: 托马斯·斯多克芒, role: 浴场医官，发现污染的人, traits: 天真、急躁，相信事实一公布大家自然会站在他这边；受挫后言辞越来越激烈}
  - {name: 彼得·斯多克芒, role: 市长、警察局长、浴场董事会主席，医生的哥哥, traits: 谨慎、重权威；擅长分别找人谈话，把问题改述成对方的切身损失}
  - {name: 霍夫斯塔, role: 《人民先驱报》编辑, traits: 以进步自居，实际跟着订户和风向走；先支持后倒戈}
  - {name: 毕凌, role: 报纸副编辑, traits: 口头激进，私下正在谋市政职位}
  - {name: 阿斯拉克森, role: 印刷所老板，房主联合会主席，自称代表“结实的多数”, traits: 口头禅是“温和”；谁代表纳税人的钱袋他就站在谁一边，大会上任主席}
  - {name: 摩登·基尔, role: 制革厂主，医生妻子的养父, traits: 起初当成恶作剧；自己的厂就是污染源，后来用遗产和股票向医生施压}
  - {name: 霍斯特船长, role: 医生的朋友, traits: 不关心本地政治，是唯一肯借出场地、事后仍然帮忙的人，因此丢了船}
  - {name: 凯瑟琳与佩特拉, role: 医生的妻子和女儿（教师）, traits: 妻子担心生计但最终站在丈夫一边；女儿坚定支持父亲并因此被学校辞退}
events:
  - {what: 医生收到化验结果，证实浴场的水受污染。在场的报纸编辑当即表示愿意刊登他的报告，医生很高兴自己为本城立了功。, who: [托马斯·斯多克芒, 霍夫斯塔, 毕凌, 凯瑟琳与佩特拉]}
  - {what: 基尔来访，把这事当作捉弄市长的玩笑。霍夫斯塔和阿斯拉克森分别上门表示支持，后者保证“结实的多数”站在医生一边。, who: [摩登·基尔, 霍夫斯塔, 阿斯拉克森, 托马斯·斯多克芒]}
  - {what: 市长要求弟弟收回报告、私下处理，并警告公开会毁掉全城和他自己的家；医生拒绝，市长以解职相威胁。, who: [彼得·斯多克芒, 托马斯·斯多克芒]}
  - {what: 市长到报馆向编辑和印刷商说明整改的费用和对本城生意的打击。霍夫斯塔、毕凌、阿斯拉克森当场改变立场，报纸改登市长的声明，拒登医生的报告。, who: [彼得·斯多克芒, 霍夫斯塔, 毕凌, 阿斯拉克森]}
  - {what: 医生决定自己召集市民大会；只有霍斯特船长肯借出房子。, who: [托马斯·斯多克芒, 霍斯特船长]}
  - {what: 大会上阿斯拉克森被推为主席，会场先议的是要不要让医生讲浴场的事。医生转而痛斥“结实的自由派多数”，听众被激怒。, who: [阿斯拉克森, 彼得·斯多克芒, 霍夫斯塔, 托马斯·斯多克芒]}
  - {what: 人群高喊他是人民公敌；会议付诸表决，通过决议宣布医官斯多克芒为“人民公敌”。散场时有人扬言去砸他家窗户。, who: [阿斯拉克森, 霍夫斯塔, 托马斯·斯多克芒]}
  - {what: 次日：窗户被砸，房东要他搬家，佩特拉被学校辞退，市长送来解职通知和一份号召全城不再请他看病的决议；霍斯特也被船东解雇。, who: [托马斯·斯多克芒, 凯瑟琳与佩特拉, 彼得·斯多克芒, 霍斯特船长]}
  - {what: 基尔告知已用本该留给医生妻儿的钱买进浴场股票，逼他改口；医生拒绝，也拒绝离开本城。, who: [摩登·基尔, 托马斯·斯多克芒]}
outcome: 说出真相的人被市民大会正式宣布为“人民公敌”，失去职位、住所和病人，污染问题没有被处理；他决定留下，自称最孤立的人最有力量。
theories: [asch_conformity, preference_falsification, two_step_flow]
en:
  title: "An Enemy of the People (En folkefiende)"
  setting: >-
    A seaside town in southern Norway in the 1880s that lives off its spa baths, over a few days.
  summary: >-
    Stockmann, the medical officer of the Baths, finds that the Baths' water supply is contaminated; at first the newspaper editor and the spokesman of
    the small householders both express support, and he supposes the whole town will thank him. The Mayor (his elder brother) puts the same matter to
    these people in other terms: the remedy will cost a great deal, the Baths will have to close for two years, and the cost will fall on the ratepayers;
    the supporters then change sides one by one, the paper prints the Mayor's reassuring statement instead, and the doctor's report has nowhere to be
    published. By the time of the public meeting, the chairman and the speakers have already replaced the question "is the water poisoned" with "is this
    man harming the town"; the doctor, provoked, turns to attacking "the majority", the meeting passes a resolution on the spot declaring him an enemy of
    the people, and what follows is smashed windows, dismissal, notice to quit his house, and his daughter losing her post. This is a case of true
    information losing to a framing in terms of interests: what changed people's attitudes was not new evidence, but who first explained to whom "what
    this means for you".
  people:
    - name: "Thomas Stockmann"
      role: "Medical officer of the Baths, the man who discovers the contamination"
      traits: >-
        Naive and impetuous, believing that once the facts are published everyone will naturally take his side; after the setback his language grows ever more
        violent.
    - name: "Peter Stockmann"
      role: "Mayor, chief of police and chairman of the Baths' board; the doctor's elder brother"
      traits: >-
        Cautious, a respecter of authority; good at talking to people one at a time and restating the problem as the listener's own direct loss.
    - name: "Hovstad"
      role: "Editor of the People's Messenger"
      traits: >-
        Styles himself a progressive, but in fact follows his subscribers and the way the wind blows; supports first, then changes sides.
    - name: "Billing"
      role: "Sub-editor of the paper"
      traits: >-
        Radical in words, privately angling for a municipal post.
    - name: "Aslaksen"
      role: "Printer, chairman of the Householders' Association, self-declared representative of the \"compact majority\""
      traits: >-
        His watchword is "moderation"; stands with whoever speaks for the ratepayers' purse; takes the chair at the meeting.
    - name: "Morten Kiil"
      role: "Tannery owner, foster-father of the doctor's wife"
      traits: >-
        At first takes it for a prank; his own tannery is the very source of the contamination, and he later uses the inheritance and shares to put pressure
        on the doctor.
    - name: "Captain Horster"
      role: "The doctor's friend"
      traits: >-
        Takes no interest in local politics; the only one willing to lend a place for the meeting and who still helps afterwards, and loses his ship for it.
    - name: "Katherine and Petra"
      role: "The doctor's wife and daughter (a teacher)"
      traits: >-
        The wife worries about their livelihood but in the end stands by her husband; the daughter firmly supports her father and is dismissed by her school
        for it.
  events:
    - >-
      The doctor receives the results of the analysis, confirming that the Baths' water is contaminated. The newspaper editors who are present at once say
      they are willing to print his report, and the doctor is delighted to have done the town a service.
    - >-
      Kiil calls and treats the affair as a joke played on the Mayor. Hovstad and Aslaksen each come to the house to express support, the latter
      guaranteeing that the "compact majority" stands behind the doctor.
    - >-
      The Mayor demands that his brother withdraw the report and deal with the matter privately, and warns that making it public would ruin the whole town
      and his own family; the doctor refuses, and the Mayor threatens him with dismissal.
    - >-
      The Mayor goes to the newspaper office and explains to the editor and the printer what the remedy will cost and the blow it will deal to the town's
      business. Hovstad, Billing and Aslaksen change their position on the spot; the paper prints the Mayor's statement instead and refuses the doctor's
      report.
    - >-
      The doctor decides to call a public meeting himself; only Captain Horster is willing to lend his house.
    - >-
      At the meeting Aslaksen is chosen as chairman, and the first thing debated is whether the doctor should be allowed to speak about the Baths at all.
      The doctor turns instead to denouncing the "compact liberal majority", and the audience is enraged.
    - >-
      The crowd shouts that he is an enemy of the people; the meeting puts it to the vote and passes a resolution declaring Medical Officer Stockmann an
      "enemy of the people". As the meeting breaks up some people threaten to go and smash the windows of his house.
    - >-
      The next day: the windows have been smashed, the landlord wants him to move out, Petra has been dismissed by her school, and the Mayor brings notice
      of his dismissal and a resolution calling on the whole town to stop consulting him as a doctor; Horster too has been dismissed by the ship's owner.
    - >-
      Kiil tells him he has used the money that should have been left to the doctor's wife and children to buy up shares in the Baths, to force him to take
      back what he said; the doctor refuses, and also refuses to leave the town.
  outcome: >-
    The man who told the truth is formally declared an "enemy of the people" by a public meeting and loses his post, his home and his patients, and the
    contamination is not dealt with; he decides to stay, declaring that the most isolated man is the strongest.
  checked:
    - >-
      Fetched the full text of Project Gutenberg #2446 and checked: in Act IV the crowd shouts "He is an enemy of the people!", the chairman moves the
      resolution "This meeting declares that it considers Dr. Thomas Stockmann, Medical Officer of the Baths, to be an enemy of the people", and the crowd's
      shouts as the meeting breaks up; in Act V Petra says she has received "notice of dismissal"; in Act II the Mayor raises dismissal (dismissed).
    - >-
      The article confirms: Ibsen's play of 1882, original title En folkefiende; the list of characters and each one's position; and, in the act-by-act
      synopsis, the results of the analysis, Kiil taking it for a prank, Hovstad and Aslaksen supporting at first, the Mayor's warning, the newspaper office
      printing the Mayor's statement instead in Act III, Horster lending his house, Aslaksen taking the chair, the "compact liberal majority", the threat to
      smash windows, the notice to quit, Petra losing her job, the letter of dismissal and the boycott resolution, Kiil buying shares to apply pressure, and
      the doctor deciding to stay. The article's infobox gives only the year of the premiere, 1883.
    - >-
      The article's lead states that the play was written in 1882 and premiered at the Christiania Theater on 13 January 1883 (the article cites Store
      norske leksikon); the list of characters agrees with the English article.
