    author: English Wikipedia
    year:
    locator: Characters 与 Plot（Act I–V）两节
    url: https://en.wikipedia.org/wiki/An_Enemy_of_the_People
    verified: true
    checked: >-
      条目证实：易卜生1882年剧作，原名 En folkefiende；人物表与各人身份；逐幕梗概中的化验结果、基尔当成恶作剧、霍夫斯塔与阿斯拉克森先支持、
      市长警告、第三幕报馆改登市长声明、霍斯特借出房子、阿斯拉克森任主席、“compact liberal majority”、砸窗威胁、退租、佩特拉失业、
      解约信与抵制决议、基尔买股票施压、医生决定留下。该条目信息框只写首演年份1883。
