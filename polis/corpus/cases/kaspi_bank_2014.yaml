      往分行运送平日五倍的现金；悬赏一亿坚戈、收到一千多封来信；Calvi 称短期内通常有10–15%的客户取钱。
      “约9%”是我用 400 ÷ 4420 算的，报道没有印这个比例。报道没有说流出何时停止。
      Confirmed: about 10% of depositors withdrew 40 billion tenge over the previous three days; deposit base 442 billion; five times the usual cash shipped.
      The 9% share is my own division. The article does not say when the outflow stopped.
