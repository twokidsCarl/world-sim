title: 子夜
kind: novel
setting: 1930年5月至7月的上海，中原大战期间；吴公馆、公债交易所与吴荪甫的丝厂。
summary: >-
  小说里公债的涨跌取决于前线战事的消息，而谁先知道消息、谁能制造消息，就决定谁赚谁赔：投机者分成押中央军胜的“多头”和押其败的“空头”。
  买办金融家赵伯韬不只是打听消息，还出钱让军队在战场上故意失利，并放出假消息，引冯云卿这样的散户入套。
  冯云卿想通过女儿从赵伯韬身边套出内幕，女儿不懂多空，带回的信息是错的，他照此下注而倾家荡产——这是一条靠私人关系传递、在传递中失真的消息链。
  赵伯韬又散布吴荪甫资金吃紧的流言，吴的姐夫杜竹斋因此从益中公司抽走资本，流言部分地变成了事实。
  最后决战时，吴荪甫押上工厂和住宅做空头，杜竹斋倒向对手，吴一败涂地。
  本案例对应的是“消息驱动的市场＋操纵者＋盟友背叛”，小说中没有出现储户挤兑银行的场面。
people:
  - {name: 吴荪甫, role: 民族工业资本家，裕华丝厂老板，益中信托公司发起人, traits: 刚愎、有魄力，起初怀疑合伙做多是圈套，后来越陷越深，把全部家当押在一次消息判断上}
  - {name: 赵伯韬, role: 买办金融资本家，公债市场的大户，有美国资本支持, traits: 消息灵通且主动制造消息；用贿赂、假消息和流言同时操纵行情和对手的信用}
  - {name: 杜竹斋, role: 金融界人士，吴荪甫的姐夫, traits: 谨慎、只认钱；听到不利风声就先撤资，最后关头倒向更强的一方}
  - {name: 冯云卿, role: 从乡下迁居上海的地主，公债散户，绰号“笑面虎”, traits: 赔了钱急于翻本，相信内幕消息比行情本身可靠}
  - {name: 冯眉卿, role: 冯云卿的女儿, traits: 天真，不懂多头空头，被父亲派去接近赵伯韬却带回错误信息}
  - {name: 何慎庵, role: 前清县官出身的公债投机者, traits: 与冯云卿一样追着传闻下注，同样落入圈套}
  - {name: 孙吉人与王和甫, role: 轮船公司与煤矿公司老板，吴荪甫在益中公司的合伙人, traits: 跟随吴荪甫的判断行事，共同承担后果}
  - {name: 尚仲礼, role: 信托公司理事长，赵伯韬的合伙人, traits: 帮赵伯韬出面拉人合伙做公债}
events:
  - {what: 吴老太爷到上海当夜去世。丧事上宾客聚在吴公馆，谈的是前线战事、公债行情和各自的生意，而不是死者。, who: [吴荪甫, 杜竹斋, 赵伯韬]}
  - {what: 赵伯韬与尚仲礼拉吴荪甫、杜竹斋合伙做公债；吴荪甫5月第一次与赵联手做多头时就疑心这是圈套。同时吴与孙吉人、王和甫筹办益中信托公司。, who: [赵伯韬, 尚仲礼, 吴荪甫, 杜竹斋, 孙吉人与王和甫]}
  - {what: 赵伯韬出钱买通军队在关键战斗中失利以左右债价，并制造假消息；冯云卿、何慎庵等散户照着传闻买卖，落入圈套。, who: [赵伯韬, 冯云卿, 何慎庵]}
  - {what: 赔了钱的冯云卿知道赵伯韬好色，说服独生女去接近赵以刺探内幕；女儿分不清多空，带回的消息有误，冯云卿据此下注，彻底破产。, who: [冯云卿, 冯眉卿, 赵伯韬]}
  - {what: 吴荪甫在6月和7月两度改做空头，与做多头的赵伯韬势同水火；赵同时对益中公司实行金融封锁，意图吞并吴的企业。, who: [吴荪甫, 赵伯韬]}
  - {what: 赵伯韬散布吴荪甫资金出了问题的流言；杜竹斋闻讯从益中公司撤走自己的资本，吴的资金果真吃紧。, who: [赵伯韬, 杜竹斋, 吴荪甫]}
  - {what: 吴荪甫把丝厂和住宅都抵押出去，在公债市场上孤注一掷做空。, who: [吴荪甫, 孙吉人与王和甫]}
  - {what: 7月交割前的决战中，杜竹斋倒向赵伯韬一方；做空头的吴荪甫被做多头的赵、杜联手击败。, who: [杜竹斋, 赵伯韬, 吴荪甫]}
outcome: 吴荪甫在公债市场上破产，下令丝厂全厂停工，带妻子离开上海去庐山；益中公司下属各厂被迫出顶。
theories: [allport_postman_rumor_law, informational_cascade]
en:
  title: "Midnight"
  setting: >-
    Shanghai from May to July 1930, during the Central Plains War; the Wu mansion, the government bond exchange, and Wu Sunfu's silk factory.
  summary: >-
    In the novel the rise and fall of government bonds depends on news of the fighting at the front, and who knows the news first, and who is able to
    manufacture news, decides who gains and who loses: the speculators divide into "bulls" betting on the central army's victory and "bears" betting on
    its defeat. The comprador financier Zhao Botao does not merely seek out news; he also pays for troops to lose deliberately on the battlefield and puts
    out false news, luring small investors such as Feng Yunqing into the trap. Feng Yunqing tries to get inside information out of Zhao Botao's circle
    through his daughter; the daughter does not understand bull and bear and the information she brings back is wrong, he places his bets on it and loses
    everything he has — a chain of news passed along through personal ties and distorted in the passing. Zhao Botao also spreads the rumour that Wu Sunfu
    is short of funds; Wu's brother-in-law Du Zhuzhai therefore pulls his capital out of the Yizhong company, and the rumour in part becomes fact. In the
    final decisive battle Wu Sunfu stakes his factory and his house on the bear side, Du Zhuzhai goes over to the opponent, and Wu is utterly defeated.
    What this case corresponds to is "a news-driven market + a manipulator + betrayal by an ally"; no scene of depositors running on a bank appears in the
    novel.
  people:
    - name: "Wu Sunfu"
      role: "National industrial capitalist, owner of the Yuhua Silk Factory, founder of the Yizhong Trust Company"
      traits: >-
        Headstrong and forceful; at first suspects that going in together on the bull side is a trap, later sinks deeper and deeper and stakes everything he
        owns on one judgement of the news.
    - name: "Zhao Botao"
      role: "Comprador financial capitalist, a big player in the government bond market, backed by American capital"
      traits: >-
        Well informed, and an active manufacturer of news; uses bribery, false news and rumour to manipulate both the market and his opponent's credit at
        once.
    - name: "Du Zhuzhai"
      role: "A figure in financial circles, Wu Sunfu's brother-in-law (his elder sister's husband)"
      traits: >-
        Cautious, recognising nothing but money; withdraws his capital first at any unfavourable word, and at the last moment goes over to the stronger side.
    - name: "Feng Yunqing"
      role: "A landlord who has moved from the countryside to Shanghai, a small investor in government bonds, nicknamed the \"Smiling Tiger\""
      traits: >-
        Having lost money and anxious to win it back, trusts inside information as more reliable than the market itself.
    - name: "Feng Meiqing"
      role: "Feng Yunqing's daughter"
      traits: >-
        Naive, does not understand bulls and bears; sent by her father to get close to Zhao Botao, but brings back wrong information.
    - name: "He Shen'an"
      role: "A government bond speculator, formerly a county magistrate under the Qing"
      traits: >-
        Like Feng Yunqing places his bets by chasing rumours, and likewise falls into the trap.
    - name: "Sun Jiren and Wang Hefu"
      role: "Owners of a shipping company and a coal-mining company, Wu Sunfu's partners in the Yizhong company"
      traits: >-
        Act on Wu Sunfu's judgement and share the consequences.
    - name: "Shang Zhongli"
      role: "Chairman of the board of a trust company, Zhao Botao's partner"
      traits: >-
        Acts as the front man for Zhao Botao in drawing people into partnerships in government bonds.
  events:
    - >-
      Old Mr Wu dies on the night he arrives in Shanghai. At the funeral the guests gather in the Wu mansion and talk of the fighting at the front, the bond
      market and their own businesses, not of the dead man.
    - >-
      Zhao Botao and Shang Zhongli draw Wu Sunfu and Du Zhuzhai into a partnership in government bonds; already in May, the first time he joins Zhao on the
      bull side, Wu Sunfu suspects this is a trap. At the same time Wu, with Sun Jiren and Wang Hefu, sets about founding the Yizhong Trust Company.
    - >-
      Zhao Botao pays to buy the army's defeat in key battles so as to sway bond prices, and manufactures false news; small investors such as Feng Yunqing
      and He Shen'an buy and sell on the rumours and fall into the trap.
    - >-
      Feng Yunqing, having lost money and knowing Zhao Botao's weakness for women, persuades his only daughter to get close to Zhao in order to pry out
      inside information; the daughter cannot tell bull from bear, the news she brings back is mistaken, and Feng Yunqing places his bets on it and is
      completely ruined.
    - >-
      Wu Sunfu twice switches to the bear side, in June and in July, and is irreconcilably at odds with Zhao Botao on the bull side; Zhao at the same time
      imposes a financial blockade on the Yizhong company, intending to swallow up Wu's enterprises.
    - >-
      Zhao Botao spreads the rumour that Wu Sunfu's funds are in trouble; Du Zhuzhai, hearing it, withdraws his own capital from the Yizhong company, and
      Wu's funds do indeed become tight.
    - >-
      Wu Sunfu mortgages both the silk factory and his house and stakes everything on going short in the government bond market.
    - >-
      In the decisive battle before the July settlement, Du Zhuzhai goes over to Zhao Botao's side; Wu Sunfu, on the bear side, is defeated by Zhao and Du
      acting together on the bull side.
  outcome: >-
    Wu Sunfu is bankrupted in the government bond market, orders the whole silk factory to stop work, and leaves Shanghai with his wife for Lushan; the
    factories under the Yizhong company are forced to be made over to others.
  checked:
    - >-
      The article confirms: the author is Mao Dun; the original title was Twilight (《夕阳》); begun in October 1931 and completed on 5 December 1932, nineteen
      chapters in all, published in January 1933 by the Kaiming Bookstore in Shanghai; the plot section says that Zhao Botao draws Wu Sunfu and Du Zhuzhai
      into speculation in government bonds, that Wu also forms the Yizhong Trust Company with Sun Jiren and Wang Hefu, and that he fails in the end; the
      characters section lists the identities of Du Zhuzhai (Wu Sunfu's brother-in-law), Zhao Botao (a big player in government bonds), Feng Yunqing (the
      "Smiling Tiger"), Feng Meiqing, He Shen'an, Shang Zhongli, Sun Jiren and Wang Hefu. The article carries a "needs more sources" tag and its plot is
      very brief, so the details were checked separately against the two articles below.
    - >-
      Marked as unverified: the text of the novel itself was not opened directly (the work is still in copyright). The plot was checked against Tuo
      Jianing's (妥佳宁) article 《重读〈子夜〉：资产阶级何以民族、经济危机何以世界》 (Rereading Midnight: how the bourgeoisie is national and how the economic crisis is global), as
      reprinted by China Writer (中国作家网) (originally published in the Journal of Sichuan University (Philosophy and Social Sciences Edition); put online on
      15 May 2024): Wu Sunfu caught between three lines of fire; bulls and bears betting respectively on the central army's victory and defeat; Wu already
      suspecting a trap in May, the first time he joined Zhao Botao on the bull side, and twice switching to the bear side, in June and July; Zhao imposing
      a financial blockade on him and scheming to swallow him up; the ending being that, because of the betrayal of his brother-in-law Du Zhuzhai, Wu Sunfu
      on the bear side is defeated by Zhao Botao and Du Zhuzhai together on the bull side, Wu ordering the silk factory to stop all work the next day, and
      Yizhong's small factories being forced to be made over to others; the novel goes only as far as just before the July bond settlement date. For the
      chapter location (chapters 2 and 3, where the people at the funeral talk of how government bonds are affected by news of the fighting), see also China
      Writer at https://www.chinawriter.com.cn/n1/2023/0113/c419384-32605953.html .
    - >-
      The article's synopsis confirms: at the funeral the guests take the opportunity to exchange news, talking of the war, the market and business; Zhao
      Botao and Shang Zhongli urge Wu Sunfu and his brother-in-law to go into partnership in government bonds; Zhao is backed by American capital, will
      "bribe the army to lose strategic battles" and "creates false news", so that small investors such as Feng Yunqing and He Shen'an are trapped; Feng
      Yunqing has his only daughter get close to Zhao to obtain inside information, the daughter does not understand bull/bear, and her misunderstanding
      leads to her father's complete ruin; Zhao spreads the rumour that Wu's finances are in trouble, and Du Zhuzhai therefore withdraws his capital from
      the trust company; Wu mortgages the silk factory and his house to take a gamble in the government bond market; Du Zhuzhai in the end defeats him; Wu
      decides to close the factory and go to Lushan with his wife. This is a synopsis on a secondary literary reference site, not an academic journal; it
      agrees with the previous entry on the ending.
sources:
  - work: 子夜（维基百科条目）
    author: 中文维基百科
    year:
    locator: 导言、“情节”“角色”两节
    url: https://zh.wikipedia.org/wiki/子夜_(小说)
    verified: true
    checked: >-
      条目证实：作者茅盾，原名《夕阳》，1931年10月动笔、1932年12月5日完稿，共十九章，1933年1月由上海开明书店出版；
      情节一节写赵伯韬拉吴荪甫、杜竹斋做公债投机，吴又与孙吉人、王和甫组益中信托公司，最终失败；
      角色一节列出杜竹斋（吴荪甫姐夫）、赵伯韬（公债大户）、冯云卿（“笑面虎”）、冯眉卿、何慎庵、尚仲礼、孙吉人、王和甫的身份。
      条目带“需要更多来源”标记，情节很简略，故另以下面两篇文章核对细节。
  - work: 子夜
    author: 茅盾
    year: 1933
    locator: 开明书店1933年1月初版，十九章；公债线索主要见于第二、三章（丧事）及结尾的7月交割
    url: https://www.chinawriter.com.cn/n1/2024/0515/c419384-40236377.html
    verified: false
    checked: >-
      标为未核实：未直接打开小说原文（作品仍在版权期内），情节据中国作家网转载的妥佳宁《重读〈子夜〉：资产阶级何以民族、经济危机何以世界》
      （原载《四川大学学报（哲学社会科学版）》，2024年5月15日上网）核对：吴荪甫“夹在三条火线中”；多头与空头分别押中央军胜、败；
      吴5月第一次与赵伯韬联手做多头时已怀疑是圈套，6月、7月两度改做空头；赵对其金融封锁并图谋吞并；
      结局是“由于姐夫杜竹斋的背叛，做空头的吴荪甫被做多头的赵伯韬和杜竹斋联合击败”，吴下令丝厂“明天全厂停工”，益中各小厂被迫出顶；
      小说只写到7月公债交割期前。章回定位（第二、三章写丧事上众人谈公债受战事消息影响）另见中国作家网
      https://www.chinawriter.com.cn/n1/2023/0113/c419384-32605953.html 。
  - work: Analysis of Mao Dun’s Midnight
    author: Nasrullah Mambrol（Literary Theory and Criticism, literariness.org）
    year: 2023
    locator: 2023年8月2日网页文章，情节梗概部分
    url: https://literariness.org/2023/08/02/analysis-of-mao-duns-midnight/
    verified: true
    checked: >-
      该文梗概证实：丧事上宾客借机交换消息，谈战事、行情、生意；赵伯韬与尚仲礼劝吴荪甫及其姐夫合伙做公债；
      赵有美国资本支持，“bribe the army to lose strategic battles”并“creates false news”使冯云卿、何慎庵等散户入套；
      冯云卿让独生女接近赵以取得内幕，女儿不懂 bull/bear，其误解导致父亲彻底破产；赵散布吴财务出问题的流言，
      杜竹斋因此从信托公司撤资；吴抵押丝厂与住宅在公债市场冒险；杜竹斋最终击败他；吴决定关厂并与妻子去庐山。
      这是一个二手文学参考站点的梗概，不是学术期刊；与上一条在结局上一致。
