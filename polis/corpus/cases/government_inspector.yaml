title: 钦差大臣（Ревизор）
kind: drama
setting: 19世纪30年代俄国外省的一座小城，前后不过一两天；市长家与城里的小旅馆。
summary: >-
  市长从一封私信里得知有钦差要微服来查，全城官员本来就心虚，于是处在“随时会有人推门进来”的紧张里。
  两个爱传话的地主在旅馆见到一个从彼得堡来、住了两周不付账也不走的年轻人，仅凭这几条线索就断定他是钦差，
  市长一听便信，其他官员跟着信；此后年轻人说的每句话都被按“他是钦差”来解读，连他的实话也被当成伪装。
  误信一旦成为共识，官员们争相行贿、商人们争相告状，市长甚至把女儿许配给他。
  纠正这一信念的不是任何人的怀疑，而是邮政局长私拆的一封信，以及真钦差到达的通报。
people:
  - {name: 市长（安东·安东诺维奇）, role: 小城最高长官，贪污受贿, traits: 老练而多疑，但因心里有鬼，最先也最彻底地接受了“钦差已到”的说法}
  - {name: 赫列斯塔科夫, role: 彼得堡来的小文官，路过此地、输光了钱, traits: 轻浮、随口吹嘘；起初并不知道自己被认错，后来顺水推舟}
  - {name: 鲍勃钦斯基与多勃钦斯基, role: 城里的两个地主，形影不离, traits: 抢着报信、互相抢话；是误信的源头，把旅馆老板的几句话拼成了“他就是钦差”}
  - {name: 奥西普, role: 赫列斯塔科夫的仆人, traits: 比主人清醒，看出继续下去有危险，劝主人赶紧走}
  - {name: 邮政局长（什佩金）, role: 掌管邮件，惯于私拆信件, traits: 好奇心重；掌握唯一能证伪的硬信息}
  - {name: 安娜与玛丽亚, role: 市长的妻子和女儿, traits: 虚荣，乐于相信贵客身份，成为赫列斯塔科夫调情和求婚的对象}
  - {name: 法官、慈善院督办、督学, role: 城里的其他官员, traits: 各有把柄，彼此观望，见市长信了便跟着行贿}
  - {name: 商人们, role: 受市长盘剥的本地商人, traits: 把“钦差”当成告状的机会，同样不加核实}
events:
  - {what: 市长召集官员，宣布从友人来信得知：一位钦差将从彼得堡微服前来，可能已经到了。众人慌忙商量如何遮掩各自的劣迹。, who: [市长（安东·安东诺维奇）, 法官、慈善院督办、督学, 邮政局长（什佩金）]}
  - {what: 两位地主冲进来抢着报告：旅馆里住着一个彼得堡来的年轻官员，说是去萨拉托夫却住了两周不走、不付账、还四处打量——他们断定此人就是钦差。, who: [鲍勃钦斯基与多勃钦斯基, 市长（安东·安东诺维奇）]}
  - {what: 市长大惊，当即相信，赶去旅馆。赫列斯塔科夫以为是来抓他欠账的；市长则把他的每句辩解都听成钦差在装样子。, who: [市长（安东·安东诺维奇）, 赫列斯塔科夫]}
  - {what: 赫列斯塔科夫被请进市长家，酒后大肆吹嘘自己在彼得堡的地位，官员们越听越怕。, who: [赫列斯塔科夫, 市长（安东·安东诺维奇）, 安娜与玛丽亚]}
  - {what: 官员们逐个上门“借”钱给他；商人们来告市长的状，他照样收钱。, who: [法官、慈善院督办、督学, 邮政局长（什佩金）, 商人们, 赫列斯塔科夫]}
  - {what: 赫列斯塔科夫先后向市长的妻子和女儿调情，并与女儿订婚；他给彼得堡的朋友写信嘲笑全城的人。, who: [赫列斯塔科夫, 安娜与玛丽亚]}
  - {what: 奥西普劝主人趁早离开，两人乘车走了。市长以为攀上了高枝，回头要收拾告状的商人，并接受全城道贺。, who: [奥西普, 赫列斯塔科夫, 市长（安东·安东诺维奇）, 商人们]}
  - {what: 邮政局长拿着私拆的那封信闯进来当众念出：赫列斯塔科夫根本不是钦差，信里把每个人都挖苦了一遍。, who: [邮政局长（什佩金）, 市长（安东·安东诺维奇）]}
  - {what: 众人追究是谁最先说他是钦差，矛头指向两位地主。此时宪兵进来通报：奉旨从彼得堡来的官员已到，要市长立刻去见。全场僵住。, who: [鲍勃钦斯基与多勃钦斯基, 市长（安东·安东诺维奇）]}
outcome: 假钦差带着全城的贿赂离开之后，误信才被一封截获的信戳破；紧接着真钦差到达的消息传来，所有人僵立当场（“哑场”）。
theories: [allport_postman_rumor_law, informational_cascade]
sources:
  - work: Ревизор（英译 The Inspector-General，Thomas Seltzer 译）
    author: Николай Гоголь（果戈理）
    year: 1836
    locator: 五幕喜剧全文；第一幕（来信与两地主报信）、第五幕（邮政局长读信、宪兵通报）
    url: https://www.gutenberg.org/cache/epub/3735/pg3735.txt
    verified: true
    checked: >-
      取回 Project Gutenberg #3735 全文，核对了：人物表（Governor、Khlestakov、Osip、Bobchinsky、Dobchinsky、Postmaster Shpekin、Anna、Marya 等）；
      第一幕市长宣布“an Inspector from St. Petersburg, incognito”；Bobchinsky 转述旅馆老板的话（去 Saratov、住到第二周、不付账）并称“the Inspector”；
      Dobchinsky 说“doesn't pay his bills and he doesn't leave. Who else can it be?”；第五幕 Postmaster 拿着“unsealed letter”上场；
      结尾 Gendarme 通报“An official from St. Petersburg sent by imperial order has arrived”。该译本把 городничий 译作 Governor，中文通译“市长”。
  - work: The Government Inspector（维基百科条目）
    author: English Wikipedia
    year:
    locator: 导言、信息框与 Plot summary 一节
    url: https://en.wikipedia.org/wiki/The_Government_Inspector
    verified: true
    checked: >-
      条目证实：作者果戈理，1836年初版、1842年修订；首演于圣彼得堡亚历山大剧院。首演日期在同一条目里有两个写法——正文为1836年4月19日，
      信息框为1836年5月1日（应为俄历与公历之别，条目本身未说明）。情节梗概证实了官员“借钱”、商人告状、与市长女儿订婚、奥西普劝离、
      邮政局长截信、市长对观众说话以及结尾“哑场”（немая сцена）。
