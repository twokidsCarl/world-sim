title: 茶馆
kind: drama
setting: 北京裕泰大茶馆，三幕分别在1898年戊戌变法失败后、民国初年军阀混战时期、抗战胜利后国民党统治时期，前后约五十年。
summary: >-
  茶馆是各色人等碰面、交换消息的地方：第一幕里茶客们靠道听途说议论谭嗣同是谁、朝廷出了什么事，同时掌柜反复提醒“莫谈国事”，侦缉就坐在邻桌听。
  常四爷随口一句对国运的感叹被侦缉听去，当场以“谭嗣同同党”的名义带走，替他说话的同伴也被一并带走——说什么话、谁在旁边听，直接决定人的下场。
  此后两幕里，“莫谈国事”的纸条越贴越大，掌柜要时时提醒客人说话留神，特务按月勒索，茶馆里“都是熟人”的安全感消失。
  本剧的重点是言论受监视之下一个公共场所如何逐步沉默和瓦解，而不是某一条谣言的扩散；作为案例，它提供的是“信息集散地＋监听者＋自我审查”这一组关系，没有挤兑式的群体行动。
people:
  - {name: 王利发, role: 裕泰茶馆掌柜, traits: 八面玲珑，信奉多说好话、谁也不得罪；主动贴出并口头重申“莫谈国事”，是茶馆里自我审查的执行人}
  - {name: 常四爷, role: 旗人，老茶客, traits: 正直、嘴快，看不惯就说，因一句话被捕}
  - {name: 松二爷, role: 旗人，老茶客，常四爷的朋友, traits: 胆小怕事、讲礼数；想替朋友打圆场，结果一并被带走}
  - {name: 宋恩子, role: 衙门的侦缉，后来的特务, traits: 在茶馆里旁听茶客说话，按只言片语抓人；到民国后靠抓人领赏、向掌柜按月要钱}
  - {name: 秦仲义, role: 茶馆房东，主张实业救国的资本家, traits: 自信、看不起小恩小惠；对国事有自己的主张并敢当众说}
  - {name: 庞太监, role: 得势的太监, traits: 以“谁敢改祖宗章程就掉脑袋”的口气传达朝廷风向，是恐惧的信号源}
  - {name: 刘麻子, role: 说媒拉纤的人贩子, traits: 利用消息不对称两头通吃，把买卖说成帮忙}
  - {name: 茶客们, role: 茶馆里的散座客人, traits: 彼此传递听来的消息，对与己无关的惨事保持沉默}
events:
  - {what: 1898年戊戌变法失败后，茶馆满座。茶客们互相打听谭嗣同是什么人、犯了什么罪，各说各的传闻；王利发提醒各位“莫谈国事”，墙上也贴着同样的纸条。, who: [茶客们, 王利发]}
  - {what: 庞太监进店，当众说谭嗣同已被判死罪、谁动祖宗成法谁掉脑袋，并与秦仲义言语交锋。, who: [庞太监, 秦仲义]}
  - {what: 一个乡下妇人要卖掉女儿，秦仲义让人把她们轰出去；常四爷叫人给她们两碗面，并感叹大清国要完。, who: [常四爷, 秦仲义, 王利发]}
  - {what: 一直坐在旁边的侦缉宋恩子上前质问这句话，认定常四爷是谭嗣同一党，当场拿人；松二爷出面解释，也被要求一起走。其余茶客无人作声。, who: [宋恩子, 常四爷, 松二爷, 茶客们]}
  - {what: 同一幕里，刘麻子撮合贫民康六把女儿卖给庞太监，在场的人只是旁观。, who: [刘麻子, 庞太监, 茶客们]}
  - {what: 第二幕（民国、军阀混战）：街上在抓人，茶馆靠不断“改良”勉强维持；宋恩子等人靠抓人领赏，并要王利发每月初一交一笔钱了事。, who: [王利发, 宋恩子, 刘麻子]}
  - {what: 第三幕（抗战胜利后）：“莫谈国事”的纸条贴得更大，王利发还得随时提醒客人说话留神；有官方背景的人要把茶馆强占过去。, who: [王利发]}
  - {what: 王利发、常四爷、秦仲义三个老人在将被夺走的茶馆里回顾各自一生，给自己撒纸钱祭奠。, who: [王利发, 常四爷, 秦仲义]}
outcome: 靠“谁也不得罪、莫谈国事”经营了一辈子的王利发保不住茶馆，上吊自尽；茶馆落入他人之手。
