    author: First Investment Bank AD
    year: 2014
    locator: 2014年11月26日
    url: https://www.fibank.bg/uploads/_Investors/ShareholderInfo/docs/Fibank20141126EN.pdf
    verified: true
    checked: >-
      读了这封信 / read the letter. 核对了：“2014年6月恐慌性提取存款之后”，2014年6月29日按 SA.38994 方案获得12亿列弗的流动性支持。
      Confirmed: liquidity support of BGN 1.2 billion granted on 29 June 2014 after the panic withdrawals.
  - work: Bulgarian banks stabilized with aid; 5 arrested over plot to bring them down with rumors
    author: Associated Press（刊于 Fox News / carried by Fox News）
    year: 2014
    locator: 2014年6月30日
    url: https://www.foxnews.com/world/bulgarian-banks-stabilized-with-aid-5-arrested-over-plot-to-bring-them-down-with-rumors
    verified: true
    checked: >-
      取回该报道 / fetched the article. 核对了：周五传出该行缺流动性的传闻；银行提前关门；周日五人因用短信、电子邮件和电话散布不实消息被捕；
      总统紧急会商后的原话；周一33亿列弗的信贷额度；周一队伍明显比周五短；中央银行提议加重处罚。
      Confirmed: the rumours on Friday, the early closure, the arrests and the president's statement on Sunday, and smaller queues on Monday.
  - work: Bulgaria central bank warns against attacks on banking system
    author: Gulf Times（路透社稿 / Reuters copy）
    year: 2014
    locator: 2014年6月27日
    url: https://www.gulf-times.com/story/398112/bulgaria-central-bank-warns-against-attacks-on-banking-system/amp
    verified: true
    checked: >-
      取回该报道 / fetched the article. 核对了：中央银行“无端地有组织攻击保加利亚的银行”“不实的恶意传言”的说法；索非亚分行门前排队；银行称没有对业务设限。
      报道写的是“昨天”、日期是6月27日，所以声明是26日还是27日它定不了；我取的是挤兑当日。
      Confirmed the central bank's wording and the queues in Sofia. The article says "yesterday" and is dated 27 June, so the day of the statement is
      not settled by it; I have taken the day of the run.
