      前一天艾哈迈达巴德、拉杰果德、苏拉特、阿嫩德的取款机被挤兑；银行周日周一营业；2002年12月31日存款总额41,316 crore 卢比。
      “约1.3%”是我用 550 ÷ 41,316 算的，没有来源印这个比例，两个数相隔三个月。
      Confirmed the Reserve Bank's statement of 12 April and total deposits of Rs 41,316 crore at 31 December 2002. The 1.3% share is my own division.
