      队伍最长的是泽姆加莱、叶尔加瓦、文茨皮尔斯；取款机取空后几小时内补钞；首席执行官称传闻是“彻头彻尾的谎言”。
      Confirmed the Sunday-night denial by regulator and bank, the 10 million lats on Sunday, where the queues were longest, and the refilling of machines.
