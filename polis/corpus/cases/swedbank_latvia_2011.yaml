    author: The Baltic Times（据通讯社报道 / from wire reports）
    year: 2011
    locator: 2011年12月14日，里加
    url: https://www.baltictimes.com/news/articles/30152/
    verified: true
    checked: >-
      取回该报道 / fetched the article. 核对了：传闻自 Krajbanka 被接管起、周五加剧、经社交媒体传播；周日外省数百人聚到取款机前、随后到里加，
      周日晚约三分之一取款机被取空；周六叶尔加瓦地区政府转走100多万拉特；总理12月12日的说法与安全警察立案；
      发言人 Kristine Jakubovska 称自周日起取走约3000万拉特、为存款总额的1.5%；“周初银行运作恢复正常”。
      Confirmed the Friday intensification, Sunday's queues, the Jelgava transfer, the prime minister's statement, the 30 million lats / 1.5% figure
      and the return to normal at the start of the week.
