      取回该报道 / fetched the article. 核对了：32家分行；周一传闻开始；周二约5000名客户（平日约500）取走约500万美元、银行称为存款总额的1%，
      总行营业至周三凌晨3点，部分分行付本票；周三中央银行行长 Francisco de Paula Gutiérrez 电视记者会否认，至当天下午共约900万美元；
      周四约500万美元已存回；总经理 Gerardo Corrales 与监管官员的说法；此前 Financorp 与 Banco Elca 被冻结。
      “累计约2%”是我用 900万 ÷（500万 ÷ 1%）算的，报道没有直接印这个比例。报道没有给出客户总数，所以没有按人头的比例。
      Confirmed: branch count, the Monday start, Tuesday's 5,000 customers and $5 million (1% of deposits), the Wednesday denial and the $9 million total,
      and the $5 million redeposited by Thursday. The 2% cumulative share is my own division; the article gives no total customer count.
