title: BAC 圣何塞银行挤兑（2004年8月，哥斯达黎加）
kind: history
setting: 2004年8月9日至13日的哥斯达黎加；BAC San José 是一家私营银行，在全国有32家分行。此前几天，监管机构刚冻结了一家券商的资金，7月初还冻结过另一家银行的资产。
summary: >-
  一家经营正常的私营银行，因为“政府要冻结它的资金、监管机构要接管它”的传闻，在两天里被储户挤兑。
  传闻从周一开始流传，来源始终不明，靠口耳相传，也有人收到手机短信。周二，约五千名客户到柜台取款，是平日的十倍，
  取走约五百万美元，银行说相当于其存款总额的百分之一；总行营业到周三凌晨三点，有分行现金用完，改付开在中央银行账户上的本票。
  周三，中央银行行长在电视直播的记者会上说传闻是假的、从未讨论过干预这家银行；到当天下午累计取走约九百万美元。
  周四已有约五百万美元存回，周五报纸报道恢复平静。
people:
  - {name: 储户们, role: BAC San José 的存款人, traits: 刚见过券商和另一家银行被冻结，听说“这家也要被冻结”就去取钱；也有人收到短信却不当回事}
  - {name: Gerardo Corrales, role: BAC San José 总经理, traits: 提前给分行备足现金、延长营业，公开说传闻毫无根据、取款正在减少}
  - {name: Francisco de Paula Gutiérrez, role: 哥斯达黎加中央银行行长, traits: 在电视记者会上否认传闻，说这家银行偿付得起、流动性充足}
  - {name: 金融监管官员, role: 金融监管委员会（CONASSIF）主席 Luis Diego Vargas 与金融机构监管局（SUGEF）局长 Oscar Rodríguez, traits: 起初以为传闻是玩笑；事后呼吁公众分辨金融消息，并要求查清来源}
events:
  - {what: 8月初，证券监管机构暂时冻结了券商 Financorp 的资金；7月初监管机构还冻结过 Banco Elca 约8000万美元的资产。, who: [金融监管官员]}
  - {what: 8月9日（周一），关于政府可能冻结 BAC San José 资金、监管机构将要介入的传闻开始流传。, who: [储户们]}
  - {what: 8月10日（周二），约5000名客户取走约500万美元（平日约500人），银行称相当于存款总额的1%；圣何塞总行营业到周三凌晨3点，部分分行现金用完，以开在中央银行的本票支付。, who: [储户们, Gerardo Corrales]}
  - {what: 8月11日（周三），中央银行行长在电视记者会上说传闻不实、从未讨论过对该行采取措施；到当天下午累计被取走约900万美元。, who: [Francisco de Paula Gutiérrez, 储户们]}
  - {what: 8月12日（周四），约500万美元已经存回。8月13日（周五）报道称银行恢复正常。, who: [储户们]}
outcome: 银行没有倒闭，也没有被接管：挤兑集中在周一、周二两天，中央银行否认传闻后平息；累计被取走的约为存款总额的2%，其中一半以上在周四前已经存回。
theories: [informational_cascade, diamond_dybvig_bank_run, global_games_runs]
en:
  title: The run on BAC San José (Costa Rica, August 2004)
  setting: Costa Rica, 9–13 August 2004. BAC San José was a private bank with 32 branches; days earlier regulators had frozen a brokerage's funds, and in early July another bank's assets.
  summary: >-
    A sound private bank was run on for two days over a rumour that the government would freeze its funds. The rumour began on Monday, its source never found,
    spreading by word of mouth and some text messages. On Tuesday about 5,000 customers (ten times a normal day) withdrew about $5 million, 1% of deposits by the
    bank's account. On Wednesday the central bank president denied the rumour on television; about $9 million had gone by that afternoon. By Thursday about
    $5 million had been redeposited.
  people:
    - name: "Depositors"
      role: "Depositors of BAC San José"
      traits: >-
        Had just seen a brokerage and another bank frozen; went to withdraw on hearing that "this one is going to be frozen too"; some received the text
        message but paid it no heed.
    - name: "Gerardo Corrales"
      role: "General manager of BAC San José"
      traits: >-
        Stocked the branches with ample cash in advance and extended opening hours; said publicly that the rumour was entirely groundless and that withdrawals
        were falling.
    - name: "Francisco de Paula Gutiérrez"
      role: "President of the Central Bank of Costa Rica"
      traits: >-
        Denied the rumour at a televised press conference, saying the bank was solvent and had ample liquidity.
    - name: "Financial regulators"
      role: "Luis Diego Vargas, president of the financial supervision council (CONASSIF), and Oscar Rodríguez, head of the superintendency of financial institutions (SUGEF)"
      traits: >-
        At first took the rumour for a joke; afterwards urged the public to be discerning about financial news and demanded that the source be traced.
  events:
    - >-
      In early August the securities regulator temporarily froze the funds of the brokerage Financorp; in early July regulators had also frozen about $80
      million of Banco Elca's assets.
    - >-
      On 9 August (Monday), rumours began to circulate that the government might freeze BAC San José's funds and that the regulator was about to step in.
    - >-
      On 10 August (Tuesday), about 5,000 customers withdrew about $5 million (about 500 people on a normal day), which the bank said was 1% of total
      deposits; the head office in San José stayed open until 3 a.m. on Wednesday, and some branches ran out of cash and paid with cashier's cheques drawn
      on the central bank.
    - >-
      On 11 August (Wednesday), the central bank president said at a televised press conference that the rumour was untrue and that taking measures against
      the bank had never been discussed; by that afternoon about $9 million had been withdrawn in total.
    - >-
      On 12 August (Thursday), about $5 million had already been redeposited. On 13 August (Friday) it was reported that the bank was back to normal.
  outcome: The bank neither failed nor was taken over. The run was confined to Monday and Tuesday and subsided after the central bank's denial; about 2% of deposits left in total, more than half of which was back by Thursday.
  checked:
    - >-
      Fetched the article. Checked: 32 branches; the rumour starting on Monday; on Tuesday about 5,000 customers (about 500 on a normal day) withdrawing
      about $5 million, which the bank put at 1% of total deposits, the head office staying open until 3 a.m. on Wednesday, and some branches paying in
      cashier's cheques; on Wednesday the central bank president Francisco de Paula Gutiérrez denying the rumour at a televised press conference, with about
      $9 million in total by that afternoon; about $5 million redeposited by Thursday; the statements of general manager Gerardo Corrales and of the
      regulators; the earlier freezes of Financorp and Banco Elca. The "about 2% in total" is my own calculation, 9 million ÷ (5 million ÷ 1%); the article
      does not print this ratio directly. The article gives no total number of customers, so there is no per-head share.
    - >-
      Fetched the summary paragraph of the page. The summary states that depositors ran on BAC San José on 9 and 10 August, set off by a rumour that the
      regulator SUGEF was about to step in, that the rumour spread purely by word of mouth, and that calm returned after several prominent bankers came
      forward to reassure the public. The full text requires a subscription and was not read. Discrepancy with the Tico Times: the latter mentions that some
      people received text messages.
