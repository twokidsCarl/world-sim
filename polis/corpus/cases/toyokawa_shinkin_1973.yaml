title: 丰川信用金库挤兑事件（豊川信用金庫事件）
kind: history
setting: 1973年12月8日至17日前后，日本爱知县宝饭郡小坂井町（今丰川市）一带；第一次石油危机后的社会不安之中。
summary: >-
  一家经营正常的信用金库，因为三个女高中生在通勤列车上的一句玩笑，在大约一周内遭到挤兑。
  玩笑先被当事人当真，经亲戚、美容院、洗衣店一层层转述，从疑问句变成了断定句；真正把传闻变成行动的，是洗衣店老板娘偶然听到一位不知情的顾客在电话里吩咐取款，把它当成了证实。
  她取款并四处转告之后，当天就有几十人到窗口提款，同一天内传闻的说法从“好像危险”升级到“明天不会开门”。
  金库的澄清声明被曲解、维持秩序的警察被当成来搜查，又衍生出职员卷款、理事长自杀等新传闻；直到报纸集中报道“是谣言”、日本银行公开担保并把成堆现金摆在柜台看得见的地方，事态才缓和，警方随后公布了完整的传播路径。
  各来源对被提走的总额说法不一：日文维基百科写约14亿日元，英文维基百科和关西大学的论文写约20亿日元。
people:
  - {name: 女高中生A, role: 已内定进丰川信用金库工作的女高中生, traits: 把同学的玩笑当真，当晚向亲戚求证；提问时没有说出具体是哪家信用金库}
  - {name: 女高中生B与C, role: A的同学，在列车上开玩笑的人, traits: 随口一说，原意是“信用金库会被抢劫所以危险”，与经营状况无关}
  - {name: 亲戚D, role: A的亲戚, traits: 自行把“信用金库”补全成“丰川信用金库”，并打电话向住在总店附近的亲戚E求证}
  - {name: 亲戚E, role: 住在金库总店附近的人, traits: 被问之后转而去问别人，使问题变成了传闻}
  - {name: 美容院老板F, role: 小坂井町的美容院经营者, traits: 店里人来人往，把听来的话再讲给亲戚G，被旁人听到}
  - {name: 洗衣店老板H与妻子I, role: 小坂井町的洗衣店夫妇, traits: H在1966年邻近丰桥市一家非银行金融机构倒闭时受过损失（英文条目称夫妇二人都是受害者），对这类消息格外敏感；I看到“别人在取钱”就立刻行动并到处转告}
  - {name: 顾客J, role: 在洗衣店借电话的生意人, traits: 完全不知道传闻，只是因为要付货款而吩咐取120万日元}
  - {name: 业余无线电爱好者, role: 从H、I处听说消息的人, traits: 用无线电把消息一次性传给大范围的人}
  - {name: 储户们, role: 小坂井町及周边的存款人, traits: 从不同的人那里反复听到同一说法便信以为真，看到排队和警察后更加确信}
  - {name: 日本银行与东海财务局, role: 中央银行（考查局、名古屋支店）与大藏省地方机构, traits: 公开保证金库经营健全并调运现金}
events:
  - {what: 12月8日（周六）上学途中的国铁饭田线列车上，B和C对刚被丰川信用金库录用的A开玩笑说“信用金库很危险”。A当真，当晚问亲戚D；D自行认定指的是丰川信用金库，打电话问住在总店附近的亲戚E。, who: [女高中生A, 女高中生B与C, 亲戚D, 亲戚E]}
  - {what: 12月9日，E对美容院老板F说丰川信用金库好像有危险。12月10日，F把这话讲给亲戚G时，在场的洗衣店老板H听到，回去告诉了妻子I。, who: [亲戚E, 美容院老板F, 洗衣店老板H与妻子I]}
  - {what: 12月11日，传闻在小坂井町的主妇之间成为话题，路过的居民也听到了；说法从疑问变成了“丰川信用金库危险”的断定。, who: [储户们]}
  - {what: 12月13日，J在H的店里借电话，吩咐对方从丰川信用金库取120万日元付货款。I听到后以为连别人都在抢着取钱，急忙去取出180万日元；H和I把此事告诉熟人，一位业余无线电爱好者又用电台广为传播。, who: [顾客J, 洗衣店老板H与妻子I, 业余无线电爱好者]}
  - {what: 同日，59名储户涌到窗口，共提走约5000万日元。据送客去小坂井支店的出租车司机回忆，乘客的说法在一天之内从中午的“好像危险”变成16点30分左右的“要倒了”，到夜里成了“明天卷帘门不会再开”。, who: [储户们]}
  - {what: 12月14日，金库为平息事态发出的声明被曲解，流出“一万日元以下的零头会被抹掉”等说法；在场维持秩序的警察被说成是来强制搜查；又出现职员挪用公款、职员卷走5亿日元、理事长自杀等新传闻。, who: [储户们]}
  - {what: 应金库请求，各媒体从14日傍晚到15日早晨集中报道这是谣言；日本银行考查局长开记者会称该金库经营没有问题，并通过名古屋支店调运现金，总店大金库前堆起高约1米、宽约5米的现金，从窗口就能看见。, who: [日本银行与东海财务局, 储户们]}
  - {what: 12月15日，各店贴出全国信用金库连合会与全国信用金库协会联名的告示，金库高层出面向储户解释，骚动开始平息；但也有人是看了报纸才第一次知道此事而赶来取款。, who: [储户们]}
  - {what: 12月16日，警方查清并公布了谣言的传播路径，当晚NHK播出；17日各报早刊跟进报道。直到12月22日，仍有人认为金库已经倒闭，或认为警方的说法背后另有阴谋。, who: [女高中生A, 女高中生B与C, 储户们]}
outcome: 丰川信用金库没有倒闭：媒体辟谣、日本银行与财务当局公开担保并当众堆出现金之后，挤兑在几天内平息；警方认定事件源于自然发生的流言，没有犯罪行为，但谣言并未立即消失。
theories: [allport_postman_rumor_law, daley_kendall_rumor, complex_contagion, informational_cascade, diamond_dybvig_bank_run]
sources:
  - work: 豊川信用金庫事件（维基百科条目）
    author: 日本語版ウィキペディア
    year:
    locator: 导言与「事件の経緯」（1日目至10日目）、「事態がパニックに発展した要因」
    url: https://ja.wikipedia.org/wiki/豊川信用金庫事件
    verified: true
    checked: >-
      取回条目原始文本，逐日核对了本文件 events 中的全部日期、星期、金额与人数（120万、180万、59人约5000万、出租车司机所述时刻、5亿日元卷款传闻、
      现金堆高1米宽5米、14日傍晚至15日晨的报道、15日联名告示、16日警方公布与NHK报道、17日早刊、22日仍有人不信）。
      条目导言写总额“約14億円”、历时不到两周，并写明警方以信用毁损业务妨害嫌疑调查后认定无犯罪性。
      条目的主要依据是伊藤阳一、小川浩一、榊博文1974年在《総合ジャーナリズム研究》上的两篇现场调查报告和沼田健哉1989年的论文，
      这些原始文献本次没有打开，只经由条目的逐条脚注间接引用。
  - work: Toyokawa Shinkin Bank incident（维基百科条目）
    author: English Wikipedia
    year:
    locator: 导言与 Sequence 一节
    url: https://en.wikipedia.org/wiki/Toyokawa_Shinkin_Bank_incident
    verified: true
    checked: >-
      取回条目原始文本，日期链条（12月8、9、10、11、13、14、15、16、17日）、120万与180万日元、59人5000万日元、现金堆1米×5米与日文条目一致。
      差异：导言写总额“about 2 billion yen”（日文条目为约14亿日元）；15日出面说服储户的人，英文条目写的是被传自杀的理事长（chairman），
      日文条目写的是“常務理事”，本文件因此只写“金库高层”。两个条目引用的是同一批原始文献，不能算彼此独立。
  - work: 'Essential Countermeasures for Bank Runs: Lesson from Case Studies in Japan'
    author: Hisao Nagaoka, Toshihiko Takemura（関西大学ソシオネットワーク戦略研究センター）
    year: 2009
    locator: RCSS Discussion Paper Series No.84（2009年5月），2.1.2 Toyokawa Shinkin Bank
    url: https://www.kansai-u.ac.jp/riss/output/paper/pdf-rcss/dp084.pdf
    verified: true
    checked: >-
      下载PDF并抽取文本核对。该文据 Hayashi (2007) 写道：金库实际经营健全；女高中生的玩笑演变成经营不善的风评；爱知县警调查了传播过程；
      谣言出现五天后发生挤兑；总损失约20亿日元（“around 2 billion yen”），仅小坂井支店就在1650笔交易中被提走4.9亿日元；
      东海财务局长与日本银行名古屋支店长共同保证经营健全后挤兑平息。这是独立于维基条目所引文献的第二条线索，
      但篇幅只有一段，没有逐日时间线。4.9亿与1650笔这两个数字只见于此文，未写入 events。
