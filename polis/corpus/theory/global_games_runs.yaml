title: 全局博弈下的挤兑与货币攻击
title_en: Global games of runs and currency attacks
field: 经济学（博弈论 / 金融）
claim: 在共同知识下，挤兑或货币攻击这类协调博弈有多个自我实现的均衡，无法说哪一个会发生。全局博弈的思路是：让每个参与者对基本面只有一个带少量噪声的私人观察。这点噪声破坏了共同知识，使均衡变成唯一的——基本面低于某个临界值就发生攻击或挤兑，高于它就不发生。于是可以谈论挤兑的概率，并分析它如何随合约条款、投机成本、热钱规模等变化。概念出自 Carlsson 与 van Damme（1993）；Morris 与 Shin（1998）用于货币攻击；Goldstein 与 Pauzner（2005）用于 Diamond–Dybvig 式银行挤兑。
formal: 基本面 θ 不为共同知识；参与者 i 观察到 x_i = θ + ε_i（ε_i 为小噪声）。唯一均衡为临界策略：x_i 低于 x* 时攻击/取款；对应存在基本面临界值 θ*，θ < θ* 时攻击成功或挤兑发生。
parameters:
- name: θ
  meaning: 基本面（银行资产质量或央行守汇率的能力）
- name: x_i
  meaning: 参与者 i 对基本面的带噪声私人信号
- name: ε
  meaning: 信号噪声，趋于零时仍保持均衡唯一
- name: θ*
  meaning: 基本面临界值，低于它则挤兑或攻击发生
predicts:
- 挤兑是否发生由基本面决定，但在一段基本面区间内，银行本可存活却仍被恐慌挤垮。
- 挤兑概率可以事前算出，并随合约给提前取款者的承诺越慷慨而上升。
- 货币攻击的发生不只取决于基本面，还取决于热钱规模和投机交易成本。
in_engine: 只取了一点：群发消息是公共信号，收到的人知道别人也收到了，据此估计别人会去取（mind.expectation 的 public，参数 Params.public）。私人信号的噪声和由此得到的唯一均衡没有实现。
en:
  field: >-
    Economics (game theory / finance)
  claim: >-
    Under common knowledge, coordination games such as runs or currency attacks have multiple self-fulfilling equilibria, and it cannot be said which one will occur. The idea of global games is to let each player have only a private observation of the fundamentals with a small amount of noise. This bit of noise destroys common knowledge and makes the equilibrium unique — an attack or run occurs if the fundamentals are below a certain critical value, and does not occur if they are above it. One can then speak of the probability of a run and analyse how it varies with contract terms, the cost of speculation, the size of hot money and so on. The concept comes from Carlsson and van Damme (1993); Morris and Shin (1998) applied it to currency attacks; Goldstein and Pauzner (2005) applied it to Diamond–Dybvig-style bank runs.
  formal: >-
    The fundamentals θ are not common knowledge; player i observes x_i = θ + ε_i (ε_i being small noise). The unique equilibrium is a cutoff strategy: attack/withdraw when x_i is below x*; correspondingly there is a critical value of the fundamentals θ*, and when θ < θ* the attack succeeds or the run occurs.
  parameters:
  - >-
    The fundamentals (the quality of the bank's assets or the central bank's ability to defend the exchange rate)
  - >-
    Player i's noisy private signal of the fundamentals
  - >-
    The signal noise; the equilibrium remains unique as it tends to zero
  - >-
    The critical value of the fundamentals, below which a run or attack occurs
  predicts:
  - >-
    Whether a run occurs is determined by the fundamentals, but within a range of fundamentals the bank could have survived and is nevertheless brought down by panic.
  - >-
    The probability of a run can be calculated ex ante, and rises the more generous the contract's promise to early withdrawers.
  - >-
    The occurrence of a currency attack depends not only on the fundamentals but also on the size of hot money and the transaction costs of speculation.
  in_engine: >-
    Only one piece is taken. A mass message is a public signal, so its recipients know others received it too and estimate from that how many will withdraw (public in mind.expectation, parameter Params.public). Noisy private signals and the unique equilibrium they give are not implemented.
  checked:
  - >-
    The IDEAS/RePEc article page confirms the title, the two authors, American Economic Review, June 1998, volume 88 issue 3, pages 587–597, and gives the abstract. The original AEA or JSTOR pages were not opened.
  - >-
    The Crossref DOI metadata record (deposited by the publisher) confirms the title, authors, journal, year, volume and issue, and pages; the OpenAlex record for the same DOI gives the abstract, and the statement of the mechanism was written from that abstract. The Wiley publisher landing page returned a 403/verification page to scraping and could not be opened directly.
  - >-
    The Crossref DOI metadata record confirms the title, the two authors, Econometrica, September 1993, volume 61 issue 5, first page 989; the record does not give the last page. The OpenAlex record for the same DOI gives the abstract.
