title: 信息级联与羊群行为
title_en: Informational cascades and herd behavior
field: 经济学
claim: 人们依次做决定，每个人既有自己的私人信息，又能看到前面的人做了什么。前人的行动透露了他们的信息，所以参考它是理性的；但一旦前面的行动足够一致，后来者的最优选择就是不管自己的信息、直接跟随。此后的行动不再透露任何新信息，整个群体可能锁定在错误选择上，而且这种一致性很脆弱，少量新的公开信息就能把它掀翻。两篇 1992 年的论文各自独立提出了这一机制：Banerjee 称之为羊群行为并证明均衡无效率，Bikhchandani、Hirshleifer 与 Welch 称之为信息级联。
formal: 顺序决策：第 n 个人观察到前 n−1 人的行动序列和自己的私人信号，按贝叶斯法则选择期望收益更高的行动。当公共历史所含的证据压过任何单个私人信号时，级联开始：此后每个人的行动与自己的信号无关。
parameters:
- name: 私人信号
  meaning: 每个人独自得到的、关于哪个选项更好的带噪声信息
- name: 行动历史
  meaning: 可被后来者观察到的前人选择序列（只见行动，不见信号）
predicts:
- 排在前面的少数人的选择对最终结局有不成比例的影响，结局依赖顺序。
- 群体会在局部形成高度一致的行为，但其中汇集的信息很少，错误的一致并不罕见。
- 一致行为是脆弱的：一条新的公开信息或一个明显更知情者的反向行动就可能让潮流逆转。
in_engine: 部分实现。engine.Sim._observe：亲眼看见别人去取钱会直接抬高自己的信念（w_seen），即从别人的行动里推断信息。不是原模型的依次贝叶斯决策，私人信号也没有单独建模。
en:
  field: >-
    Economics
  claim: >-
    People make decisions in turn, and each has their own private information and can also see what those before them did. The actions of predecessors reveal their information, so taking them into account is rational; but once the earlier actions are sufficiently uniform, the best choice for those who come later is to disregard their own information and simply follow. Actions after that no longer reveal any new information, the whole group may lock in on a wrong choice, and this uniformity is fragile, so that a small amount of new public information can overturn it. Two 1992 papers proposed this mechanism independently: Banerjee calls it herd behaviour and proves that the equilibrium is inefficient, while Bikhchandani, Hirshleifer and Welch call it an informational cascade.
  formal: >-
    Sequential decision-making: the n-th person observes the sequence of actions of the previous n−1 people and their own private signal, and chooses by Bayes' rule the action with the higher expected payoff. When the evidence contained in the public history outweighs any single private signal, a cascade begins: from then on each person's action is independent of their own signal.
  parameters:
  - >-
    The noisy information that each person obtains alone about which option is better
  - >-
    The sequence of predecessors' choices observable by those who come later (only actions are seen, not signals)
  predicts:
  - >-
    The choices of the few people at the front of the queue have a disproportionate influence on the final outcome, and the outcome depends on the order.
  - >-
    A group will form highly uniform behaviour locally, but very little information is aggregated in it, and uniformity in error is not rare.
  - >-
    Uniform behaviour is fragile: one new piece of public information, or one contrary action by someone evidently better informed, may reverse the trend.
  in_engine: >-
    Partly implemented. engine.Sim._observe: seeing others go to withdraw money with one's own eyes directly raises one's own belief (w_seen), that is, information is inferred from others' actions. It is not the sequential Bayesian decision-making of the original model, and private signals are not modelled separately either.
