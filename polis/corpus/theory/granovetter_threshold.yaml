title: 集体行为的阈值模型
title_en: Threshold models of collective behavior (Granovetter)
field: 社会学
claim: 每个人面对“做/不做”的二选一，其得失取决于已经有多少人做了。个人的阈值是指：需要先有多少人（或多大比例）行动，他才觉得行动的净收益超过净成本。给定人群的阈值分布，就能推出最终有多少人行动；而结果对分布的精确形状极其敏感，平均倾向相近的两群人可以得到完全不同的结局，所以不能从集体结果倒推个人意愿。作者列举的应用包括骚乱、创新与谣言扩散、罢工、投票和迁移。
formal: 设 F 为阈值的累积分布，r(t) 为 t 时刻已行动的比例，则 r(t+1) = F(r(t))；均衡是 r* = F(r*) 的不动点，从 r(0) 出发迭代到达。（这是对摘要所述“由阈值分布计算均衡人数”的通行写法。）
parameters:
- name: θ_i
  meaning: 个人 i 的阈值：使其行动所需的已行动者人数或比例
- name: F
  meaning: 人群阈值的累积分布函数
- name: r(t)
  meaning: t 时刻已行动者的比例
predicts:
- 阈值分布的微小改动（例如拿走一个低阈值的人）可以让结局从全体参与变成几乎无人参与。
- 平均态度相同的两个群体，可能一个爆发、一个平静。
- 行动人数随时间呈连锁式增长，在分布出现“缺口”处停住。
in_engine: mind.withdraw_hazard：估计会去取钱的人越多（expect），自己去取的概率越高。是随个人特质变化的软阈值，不是原模型里的硬阈值。
en:
  field: >-
    Sociology
  claim: >-
    Each person faces a binary choice of "do / don't", whose gains and losses depend on how many people have already done it. An individual's threshold is the number (or proportion) of people who must act first before they feel that the net benefit of acting exceeds the net cost. Given the distribution of thresholds in a population, one can derive how many people act in the end; but the outcome is extremely sensitive to the exact shape of the distribution, and two groups with similar average inclinations can arrive at completely different outcomes, so individual willingness cannot be inferred back from the collective outcome. The applications listed by the author include riots, the diffusion of innovations and rumours, strikes, voting and migration.
  formal: >-
    Let F be the cumulative distribution of thresholds and r(t) the proportion who have acted at time t; then r(t+1) = F(r(t)); the equilibrium is a fixed point of r* = F(r*), reached by iterating from r(0). (This is the standard way of writing what the abstract describes as "calculating the equilibrium number from the distribution of thresholds".)
  parameters:
  - >-
    The threshold of individual i: the number or proportion of people who have already acted that is needed for them to act
  - >-
    The cumulative distribution function of the population's thresholds
  - >-
    The proportion of people who have acted at time t
  predicts:
  - >-
    A tiny change to the threshold distribution (for example, taking away one low-threshold person) can turn the outcome from everyone taking part into almost nobody taking part.
  - >-
    Of two groups with the same average attitude, one may erupt and the other stay calm.
  - >-
    The number of people acting grows over time in chain-reaction fashion and stops where a "gap" appears in the distribution.
  in_engine: >-
    mind.withdraw_hazard: the more people one estimates will go to withdraw money (expect), the higher the probability of going to withdraw oneself. It is a soft threshold that varies with personal traits, not the hard threshold of the original model.
  checked:
  - >-
    The Crossref DOI metadata record (deposited by the publisher) confirms the title, author, journal, year, volume and issue, and pages; the Semantic Scholar API record for the same DOI gives the abstract, and the statement of the mechanism was written from that abstract. The University of Chicago Press publisher landing page returned a 403/verification page to scraping and could not be opened directly.
sources:
- work: Threshold Models of Collective Behavior
  author: Mark Granovetter
  year: 1978
  locator: 'American Journal of Sociology 83(6): 1420–1443；DOI 10.1086/226707'
  url: https://api.crossref.org/works/10.1086/226707
