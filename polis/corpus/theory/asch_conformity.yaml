title: 阿希从众实验
title_en: Asch conformity
field: 社会心理学
claim: 即使答案一目了然，一个人面对一致给出错误答案的多数时，也常常放弃自己的判断而附和。Asch 让一名真被试与若干事先串通的假被试一起公开回答线段长短的比较题，假被试在关键轮次一致答错。从众不是因为题目难，而是来自与一致多数公开相左的压力；只要多数的一致性被打破，压力就大幅减弱。本卡的具体数字取自英文维基百科对 1951–1956 年各篇报告的转述，未能对照原文。
formal: ''
parameters:
- name: 多数人数
  meaning: 一致给出错误答案的同伴数量
- name: 一致性
  meaning: 多数是否全体一致；是否存在一个答对的同伴
predicts:
- 无人施压时这类题几乎不出错（转述的对照组错误率低于 1%）；面对一致的错误多数时，约三分之一的关键回答跟随多数。
- 个体差异很大：转述称约四分之三的被试至少附和一次，约四分之一始终不附和。
- 只有一个反对者时压力很小，增加到三人左右效果显著上升，再增加人数几乎没有额外效果。
- 多数中只要出现一个给出正确答案的同伴，附和率就大幅下降。
in_engine: mind.withdraw_hazard 里的 conformity 项：随大流的人更受“别人都在取”的估计左右。只作用于行动，不作用于信念本身。
