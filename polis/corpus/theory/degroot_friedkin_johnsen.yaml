title: 德格鲁特共识与弗里德金–约翰森社会影响模型
title_en: DeGroot consensus and Friedkin–Johnsen social influence
field: 统计学 / 数理社会学
claim: DeGroot 描述一个必须共同行动的小组如何达成一致：每个成员反复把自己的看法更新为全体成员当前看法的加权平均，权重反映他对各人的信任；论文明确给出了这个过程以及最终达成的共同看法。Friedkin 与 Johnsen 从社会过程而非均衡出发，把人际影响网络与个人意见内容联系起来，并把文献中已有的若干社会影响模型作为特例推出；在其后通行的写法里，每个人在受他人影响的同时始终保留对自己初始意见的一份坚持，因此群体通常停在持续的分歧上而不是共识。
formal: DeGroot：x(t+1) = W x(t)，W 为行随机的信任权重矩阵；满足适当条件时 x(t) 收敛到所有分量相同的共识值，它是初始意见的加权平均。Friedkin–Johnsen（后续文献通行的记法，未核对 1990 年原文符号）：x(t+1) = Λ W x(t) + (I − Λ) x(0)，Λ = diag(λ_i)，λ_i ∈ [0,1]；Λ = I 时退化为 DeGroot；稳态 x* = (I − ΛW)^(-1) (I − Λ) x(0)。
parameters:
- name: W
  meaning: 人际影响（信任）权重矩阵，每行和为 1
- name: x(0)
  meaning: 各人的初始意见
- name: λ_i
  meaning: 个人 i 对他人影响的易感度；1 − λ_i 是对自己初始意见的坚持程度
predicts:
- 在纯加权平均的群体里，意见分歧随讨论轮次缩小并趋于共识，共识位置由谁被信任得多决定。
- 只要有人对初始立场有所坚持，长期结果是意见靠拢但不重合。
- 最终意见是各人初始意见的线性组合，网络中被更多人看重的人占的权重更大。
