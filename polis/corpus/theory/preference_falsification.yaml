title: 偏好伪装
title_en: Preference falsification (Kuran)
field: 经济学 / 政治学
claim: 人在感到社会压力时会公开表达与内心不同的偏好。当很多人都这样做，公开舆论就系统性地偏离私下的真实想法：广受厌恶的制度得以维持，并且显得稳固，连身处其中的人也被误导，看不出变革的可能。可是这种支持是装出来的，一旦有足够多的人不再害怕表露真实想法，公开反对就会像滚雪球一样爆发，一件小事便能触发事前无人预料的剧变。时间久了，伪装还会扭曲公共讨论和人们实际所知，使原本靠伪装维持的东西逐渐获得真心接受。
formal: 每个人有私下偏好和公开偏好；是否公开反对取决于已公开反对的人数是否达到其个人的“革命阈值”（Kuran 1989、1991 的阈值式表述，本卡仅见 1991 年文摘要，未读正文公式）。公开反对人数的小幅上升可越过下一批人的阈值，形成连锁。
parameters:
- name: 私下偏好
  meaning: 个人内心真正想要的
- name: 公开偏好
  meaning: 个人在他人面前表达的立场
- name: 革命阈值
  meaning: 个人愿意公开表露真实偏好所需的已公开反对者规模
predicts:
- 匿名调查与公开表态之间存在系统性差距，压力越大差距越大。
- 看似稳固的政权或规范可以在很短时间内崩塌，且事前连参与者自己也料不到。
- 事后回看，剧变显得容易解释甚至必然，但同一理论预言下一次仍会出人意料。
