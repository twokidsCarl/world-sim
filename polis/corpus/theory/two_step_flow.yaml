title: 两级传播
title_en: Two-step flow of communication
field: 传播学 / 社会学
claim: 大众媒体的影响多半不是直接到达每个人，而是先到达一小部分更关注媒体的“意见领袖”，再由他们在日常交谈中解读并转给不那么关注的人；对多数人的决定而言，熟人之间的口头影响比媒体本身更重要。归属上要更正一点：这个假说最早出自 Lazarsfeld、Berelson 与 Gaudet 对 1940 年美国总统选举选民的研究《The People's Choice》，Katz 与 Lazarsfeld 1955 年的《Personal Influence》是在伊利诺伊州迪凯特所做的后续检验与展开，而不是首次提出。Katz 1957 年的回顾认为，几项后续研究大体印证并明显细化了原假说。
formal: ''
parameters:
- name: 意见领袖
  meaning: 在某一话题上媒体接触更多、并被身边人咨询的人
- name: 人际渠道
  meaning: 家人、朋友、同事之间的面对面交谈
predicts:
- 意见领袖的媒体接触量高于他们所影响的人。
- 人们改变决定时，更常把原因归于与熟人的交谈而不是媒体内容。
- 意见领袖分散在各个社会群体内部，并且因话题而异（公共事务、时尚、电影、购物各有各的领袖）。
in_engine: 只体现在结构上：population.build 给部分主角额外的人脉（hub），场所让常客之间互通消息。没有区分大众媒介与人际两步，engine.Sim._broadcast 的告示直接触达个人。
