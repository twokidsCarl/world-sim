[project]
name = "polis"
version = "0.1.0"
description = "平行社会模拟器：一群人如何决策、传播、相互揣度；可观测、可干预、可推演"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
polis = "polis.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
